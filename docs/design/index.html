<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CuaRemote · iOS 控制端原型</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  /* containers */
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  /* stacked information: each piece is its own line — never sibling inline spans */
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  /* media keeps its intrinsic ratio by default; never a distorted or cropped
     cover by accident. height:auto lets the ratio win over an <img height="…">
     attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
     AND add .od-media-cover together (per the core rule, only where a crop is
     deliberate — tile thumbs, decorative fills — never on full-frame content). */
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  /* data text only — authored copy is rewritten to its budget instead */
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
  .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

  /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ───────── Open Design · OD Next handheld shell — iPhone ───────── */
:root {
  --phone-screen-width: 393px;
  --phone-screen-height: 852px;
  --phone-bezel: 12px;
  --phone-outer-radius: 60px;
  --phone-screen-radius: 48px;
  --phone-safe-top: 59px;
  --phone-safe-bottom: 34px;
  --phone-system-fg: #0E1114;
  --phone-screen-bg: #F2F3F5;
  --phone-stage-bg: #DFE3E8;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 32px;
  background:
    radial-gradient(circle at 50% 16%, rgba(255,255,255,.92), transparent 34%),
    var(--phone-stage-bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  color: #0E1114;
}

.phone-frame {
  position: relative;
  width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
  height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
  padding: var(--phone-bezel);
  border-radius: var(--phone-outer-radius);
  background:
    linear-gradient(145deg, rgba(255,255,255,.18), transparent 17%),
    linear-gradient(160deg, #3a3a3d 0%, #1d1d20 47%, #09090b 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.13),
    inset 0 0 0 2px rgba(0,0,0,.9),
    0 34px 70px -20px rgba(0,0,0,.55),
    0 12px 28px -12px rgba(0,0,0,.36);
  isolation: isolate;
}

.phone-frame::before,
.phone-frame::after {
  content: "";
  position: absolute;
  z-index: -1;
  top: 102px;
  bottom: 102px;
  width: 3px;
  border-radius: 3px;
  background: linear-gradient(
    to bottom,
    transparent,
    rgba(255,255,255,.13) 12%,
    transparent 22%,
    transparent 78%,
    rgba(255,255,255,.08) 90%,
    transparent
  );
}
.phone-frame::before { left: -1px; }
.phone-frame::after { right: -1px; }

.hardware-button {
  position: absolute;
  width: 4px;
  border-radius: 3px;
  background: linear-gradient(90deg, #050506, #242428 58%, #08080a);
  box-shadow: inset 0 1px rgba(255,255,255,.08);
}
.hardware-button.silent { left: -3px; top: 175px; height: 34px; }
.hardware-button.volume-up { left: -3px; top: 225px; height: 62px; }
.hardware-button.volume-down { left: -3px; top: 299px; height: 62px; }
.hardware-button.power { right: -3px; top: 252px; height: 104px; }

.phone-screen {
  position: relative;
  width: var(--phone-screen-width);
  height: var(--phone-screen-height);
  overflow: hidden;
  border-radius: var(--phone-screen-radius);
  background: var(--phone-screen-bg);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}

.phone-content {
  position: absolute;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-top: var(--phone-safe-top);
  padding-bottom: var(--phone-safe-bottom);
  background: var(--phone-screen-bg);
}
.phone-content::-webkit-scrollbar { display: none; }

.dynamic-island {
  position: absolute;
  z-index: 20;
  top: 11px;
  left: 50%;
  width: 126px;
  height: 37px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: #000;
  box-shadow: inset 0 -1px 1px rgba(255,255,255,.05);
  pointer-events: none;
}

.status-bar {
  position: absolute;
  z-index: 15;
  top: 0;
  left: 0;
  right: 0;
  height: var(--phone-safe-top);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 27px 0;
  color: var(--phone-system-fg);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -.01em;
  pointer-events: none;
}
.status-icons { display: inline-flex; align-items: center; gap: 6px; }
.status-icons svg { display: block; width: 17px; height: 11px; fill: currentColor; }
.status-icons .battery { width: 25px; }

.home-indicator {
  position: absolute;
  z-index: 20;
  left: 50%;
  bottom: 8px;
  width: 134px;
  height: 5px;
  transform: translateX(-50%);
  border-radius: 999px;
  background: var(--phone-system-fg);
  opacity: .9;
  pointer-events: none;
}

@media (max-height: 939px) { .phone-frame { zoom: 0.9; } }
@media (max-height: 851px) { .phone-frame { zoom: 0.82; } }
@media (max-height: 781px) { .phone-frame { zoom: 0.74; } }
@media (max-height: 711px) { .phone-frame { zoom: 0.66; } }
@media (max-width: 480px) {
  body { padding: 0; display: block; }
  .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
  .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
  .phone-screen { width: 100%; height: 100%; border-radius: 0; }
}

/* ═══════════ CuaRemote — 柔光控制台 v2 ═══════════ */
:root {
  --bg:#F2F3F5;
  --card:#FFFFFF;
  --well:#F4F5F7;
  --line:#E7E9EC;
  --fg:#0E1114;
  --fg-2:#5C6670;
  --fg-3:#6B757F;
  --ink:#16191D;
  --ok-fg:#077A42; --ok:#0FA35C; --ok-wash:#E8F7EF;
  --w-fg:#8A5200;  --w:#C77A00;  --w-wash:#FBF0DC;
  --d-fg:#C0392B;  --d-wash:#FCECEA;
  --blue:#1A6DD8;  --blue-wash:#E9F0FD;
  --r-card:22px; --r-in:14px;
  --sh-1:0 1px 2px rgba(16,20,24,.05);
  --sh-2:0 1px 2px rgba(16,20,24,.04), 0 8px 24px rgba(16,20,24,.06);
  --sh-3:0 2px 6px rgba(16,20,24,.06), 0 18px 44px rgba(16,20,24,.12);
  --pad:20px;
  --dock-space:112px;
  --ease-out:cubic-bezier(.16,.84,.44,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}

[hidden] { display:none !important; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
input, textarea, select { font:inherit; color:inherit; }
h1,h2,h3,p,ul,ol,figure { margin:0; padding:0; }
ul,ol { list-style:none; }
:focus-visible { outline:2.5px solid var(--blue); outline-offset:2px; border-radius:8px; }
.mono { font-family:var(--mono); font-variant-ligatures:none; }
.sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.ico { width:22px; height:22px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.ico-sm { width:16px; height:16px; }
.ico-lg { width:28px; height:28px; }

/* ── 玻璃 ── */
.glass {
  background: rgba(252,253,254,.72);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 0 0 .5px rgba(16,20,24,.07),
    0 8px 32px rgba(16,20,24,.14);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: rgba(249,250,251,.97); }
}

/* ── 骨架 ── */
.app { height:100%; position:relative; background:var(--bg); }
.screen { display:none; height:100%; position:relative; grid-template-rows:auto minmax(0,1fr); }
.screen.is-active { display:grid; animation:scr var(--d-in,240ms) var(--ease-out) both; }
@keyframes scr { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
.topbar { padding:6px 10px 10px; }
.topbar h1 { font-size:17px; font-weight:680; letter-spacing:-.015em; text-align:center; }
.body { padding:0 var(--pad) var(--dock-space); }
.body > * + * { margin-top:26px; }
.body-flat { padding:0 var(--pad) 24px; }

.iconbtn { display:grid; place-items:center; min-width:44px; min-height:44px; border-radius:999px; position:relative; color:var(--fg); }
@media (hover:hover) { .iconbtn:hover { background:rgba(16,20,24,.06); } }
.iconbtn.on-card { background:var(--card); box-shadow:var(--sh-1); }
.dot-badge { position:absolute; top:7px; right:7px; min-width:8px; height:8px; border-radius:999px; background:var(--w); box-shadow:0 0 0 2px var(--bg); }

/* ── dock ── */
.navdock { position:absolute; z-index:14; left:14px; right:14px; bottom:calc(var(--phone-safe-bottom) - 6px); display:flex; gap:10px; align-items:center; }
.app.is-deep ~ .navdock, .navdock.is-hidden { opacity:0; transform:translateY(14px); pointer-events:none; }
.navdock { transition:opacity 180ms var(--ease-out), transform 220ms var(--ease-out); }
.tabbar { position:relative; flex:1 1 0; min-width:0; display:flex; padding:6px; border-radius:999px; }
.tab-ind { position:absolute; z-index:0; top:6px; bottom:6px; left:6px; width:calc((100% - 12px) / 4); border-radius:999px;
  background:#fff; box-shadow:0 1px 2px rgba(16,20,24,.10), 0 4px 10px rgba(16,20,24,.08);
  transform:translateX(calc(var(--ti, 0) * 100%)); transition:transform 300ms var(--spring); }
.tab { position:relative; z-index:1; flex:1 1 0; min-width:0; display:grid; justify-items:center; gap:2px; padding:7px 2px 6px; border-radius:999px; color:var(--fg-3); }
.tab-label { font-size:10.5px; letter-spacing:.01em; }
.tab[aria-current="page"] { color:var(--fg); }
.tab[aria-current="page"] .tab-label { font-weight:700; }
.composebtn { flex:none; width:60px; height:60px; border-radius:999px; display:grid; place-items:center; color:var(--fg); }
.composebtn:active { transform:scale(.95); }

/* ── 卡片 ── */
.card { background:var(--card); border-radius:var(--r-card); box-shadow:var(--sh-2); padding:18px; }
.card-flush { padding:0; overflow:hidden; }
.sec { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
.sec h2 { font-size:15px; font-weight:700; letter-spacing:-.01em; }
.sec .more { font-size:13.5px; font-weight:600; color:var(--blue); min-height:32px; }
.hint { font-size:13px; line-height:1.55; color:var(--fg-3); }
.display { font-size:32px; font-weight:730; letter-spacing:-.032em; line-height:1.14; }
.sub { margin-top:7px; font-size:15px; line-height:1.55; color:var(--fg-2); }

.row { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 16px; min-height:60px; border-bottom:1px solid var(--line); }
.row:last-child { border-bottom:0; }
@media (hover:hover) { button.row:hover { background:var(--well); } }
.row[disabled] { cursor:not-allowed; }
.row-t { font-size:15.5px; font-weight:620; letter-spacing:-.01em; }
.row-d { font-size:12.5px; line-height:1.45; color:var(--fg-3); }
.chev { color:#B6BDC4; flex:none; }

/* ── 徽章 ── */
.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:670; line-height:1.45; white-space:nowrap; }
.badge .d { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
.b-ok   { color:var(--ok-fg); background:var(--ok-wash); }
.b-l0   { color:var(--fg-2); background:#EDEFF2; }
.b-l1   { color:var(--w-fg);  background:var(--w-wash); }
.b-l2   { color:var(--d-fg);  background:var(--d-wash); }
.b-gui  { color:var(--blue);  background:var(--blue-wash); }
.b-mute { color:var(--fg-3);  background:#EDEFF2; }
.chan { display:inline-flex; align-items:center; padding:2px 7px; border-radius:6px; font-size:10.5px; font-family:var(--mono); letter-spacing:0; background:#EDEFF2; color:var(--fg-2); }
.chan.g { background:var(--blue-wash); color:var(--blue); }

/* ── 按钮 ── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:0 20px; border-radius:999px;
  font-size:16px; font-weight:670; letter-spacing:-.012em; transition:transform 130ms var(--ease-out), opacity 130ms; }
.btn:active { transform:scale(.978); }
.btn-primary { background:var(--ink); color:#fff; box-shadow:0 2px 6px rgba(16,20,24,.18); }
.btn-ghost { background:var(--card); color:var(--fg); box-shadow:var(--sh-1); }
.btn-well { background:#E9EBEF; color:var(--fg); }
.btn-danger { background:var(--d-wash); color:var(--d-fg); }
.btn-block { width:100%; }
.btn[disabled] { opacity:.42; cursor:not-allowed; }
.btn[disabled]:active { transform:none; }
@media (hover:hover) { .btn-primary:hover:not([disabled]) { background:#25292F; } }

.chip { display:inline-flex; align-items:center; gap:7px; min-height:42px; padding:0 15px; border-radius:999px; background:var(--card); box-shadow:var(--sh-1); font-size:14px; font-weight:620; }
@media (hover:hover) { .chip:hover { background:#fff; box-shadow:var(--sh-2); } }
.chip[disabled] { color:var(--fg-3); }

/* ── 表单 ── */
.lbl { display:block; font-size:13px; font-weight:640; color:var(--fg-2); margin-bottom:7px; }
.lbl .req { color:var(--d-fg); margin-left:3px; }
.field { width:100%; background:var(--card); border:0; box-shadow:inset 0 0 0 1.5px var(--line); border-radius:var(--r-in); padding:13px 15px; font-size:16px; line-height:1.5; color:var(--fg); }
.field::placeholder { color:#A6AEB6; }
.field:focus { outline:none; box-shadow:inset 0 0 0 2px var(--blue); }
.field.is-error { box-shadow:inset 0 0 0 2px var(--d-fg); }
.err { display:flex; align-items:flex-start; gap:6px; margin-top:7px; font-size:13px; line-height:1.45; color:var(--d-fg); }
.help { margin-top:7px; font-size:12.5px; line-height:1.5; color:var(--fg-3); }
.switch { position:relative; width:51px; height:31px; border-radius:999px; background:#D6DAE0; flex:none; transition:background 200ms var(--ease-out); }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(16,20,24,.24); transition:transform 220ms var(--spring); }
.switch[aria-checked="true"] { background:var(--ok); }
.switch[aria-checked="true"]::after { transform:translateX(20px); }
.switch[disabled] { opacity:.55; cursor:not-allowed; }
input[type="range"] { width:100%; height:30px; appearance:none; background:none; }
input[type="range"]::-webkit-slider-runnable-track { height:6px; border-radius:999px; background:#E2E5E9; }
input[type="range"]::-webkit-slider-thumb { appearance:none; width:26px; height:26px; margin-top:-10px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(16,20,24,.28); }
.radio { display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
.radio:last-child { border-bottom:0; }
.radio input { position:absolute; opacity:0; width:0; height:0; }
.rdot { width:22px; height:22px; margin-top:2px; border-radius:50%; box-shadow:inset 0 0 0 1.8px #C3C9D0; flex:none; display:grid; place-items:center; }
.radio input:checked ~ .rdot { box-shadow:inset 0 0 0 7px var(--ink); }
.radio input:focus-visible ~ .rdot { outline:2.5px solid var(--blue); outline-offset:2px; }

/* ── 设备首页 ── */
.devsw { display:flex; align-items:center; gap:9px; padding:7px 12px; border-radius:999px; min-height:44px; }
@media (hover:hover) { .devsw:hover { background:rgba(16,20,24,.05); } }
.sdot { width:9px; height:9px; border-radius:50%; flex:none; }
.s-on { background:var(--ok); }
.s-off { background:#B6BDC4; }
.s-warn { background:var(--w); }
.s-new { width:7px; height:7px; background:var(--ink); }
.shot { border-radius:var(--r-card); overflow:hidden; background:#DDE1E6; box-shadow:var(--sh-2); }
.shot-bar { display:flex; align-items:center; gap:10px; padding:11px 14px; background:var(--card); }
.mini { display:block; height:5px; border-radius:999px; background:#E6E9ED; overflow:hidden; margin-top:10px; }
.mini > i { display:block; height:100%; border-radius:999px; background:var(--ink); }
.mini.ok > i { background:var(--ok); } .mini.w > i { background:var(--w); }
.statk { font-size:12px; font-weight:600; color:var(--fg-3); }
.statv { font-size:24px; font-weight:730; letter-spacing:-.03em; }
.statu { font-size:12px; color:var(--fg-3); }
.apptile { width:46px; height:46px; border-radius:13px; display:grid; place-items:center; flex:none; background:#EBEEF1; color:#4E5862; box-shadow:inset 0 0 0 1px rgba(16,20,24,.045); }
.apptile.run { background:#E4E8ED; color:#39424B; }
.apptile.lg { width:58px; height:58px; border-radius:16px; }
.notice { display:flex; align-items:flex-start; gap:12px; padding:15px 16px; border-radius:var(--r-card); background:var(--w-wash); }
.notice.n-mute { background:var(--card); box-shadow:var(--sh-1); }
.notice.n-bad { background:var(--d-wash); }
.n-t { font-size:15px; font-weight:670; }
.n-d { margin-top:4px; font-size:13px; line-height:1.5; color:var(--fg-2); }
.n-act { min-height:36px; padding:0 13px; border-radius:999px; background:var(--ink); color:#fff; font-size:13px; font-weight:670; flex:none; }
.notice.n-mute .n-act { background:#E9EBEF; color:var(--fg); }

/* ── 简化 App ── */
.appbar { display:flex; align-items:center; gap:10px; padding:4px 8px 12px; }
.appbar .t { font-size:16px; font-weight:700; letter-spacing:-.015em; }
.appbar .s { font-size:11.5px; color:var(--fg-3); margin-top:1px; }
.player-cover { border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(16,20,24,.20); }
.transport { display:flex; align-items:center; justify-content:center; gap:26px; }
.tbtn { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; color:var(--fg); }
.tbtn.main { width:68px; height:68px; background:var(--ink); color:#fff; box-shadow:0 4px 14px rgba(16,20,24,.26); }
.tbtn:active { transform:scale(.94); }
.seek { display:block; height:6px; border-radius:999px; background:#E2E5E9; overflow:hidden; }
.seek > i { display:block; height:100%; background:var(--ink); border-radius:999px; transition:width 400ms linear; }
.qrow-art { width:48px; height:48px; border-radius:10px; overflow:hidden; flex:none; box-shadow:var(--sh-1); }

/* ── Computer Use 实时轨 ── */
.trace { position:absolute; z-index:13; left:14px; right:14px; bottom:calc(var(--phone-safe-bottom) + 98px);
  padding:12px 14px; border-radius:18px; display:none; }
.trace.is-open { display:block; animation:trace-in 240ms var(--ease-out) both; }
@keyframes trace-in { from { opacity:0; transform:translateY(10px) scale(.98) } to { opacity:1; transform:none } }
.trace-h { display:flex; align-items:center; gap:8px; }
.trace-t { font-size:13px; font-weight:680; }
.trace-c { margin-top:7px; font-family:var(--mono); font-size:11.5px; line-height:1.55; color:var(--fg-2); word-break:break-all; }
.trace-m { margin-top:8px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:11px; color:var(--fg-3); }
.spin { width:15px; height:15px; border-radius:50%; border:2px solid rgba(16,20,24,.16); border-top-color:var(--ink); animation:sp .7s linear infinite; flex:none; }
@keyframes sp { to { transform:rotate(360deg) } }

/* ── 执行详情 ── */
.stepwrap { position:relative; padding-left:34px; }
.stepwrap::before { content:""; position:absolute; left:12px; top:6px; bottom:6px; width:2px; border-radius:2px; background:var(--line); }
.stepdot { position:absolute; left:-32px; top:14px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:#E6E9ED; color:var(--fg-3); font-size:10.5px; font-weight:730; font-family:var(--mono); box-shadow:0 0 0 4px var(--bg); }
.step { position:relative; }
.step + .step { margin-top:12px; }
.step.done .stepdot { background:var(--ok); color:#fff; }
.step.run  .stepdot { background:var(--ink); color:#fff; }
.step.wait .stepdot { background:var(--w); color:#fff; }
.step.fail .stepdot { background:var(--d-fg); color:#fff; }
.step-card { background:var(--card); border-radius:18px; box-shadow:var(--sh-1); padding:14px 15px; width:100%; text-align:left; display:block; }
.step.wait .step-card { box-shadow:0 0 0 2px var(--w), var(--sh-2); }
.step.pending .step-card { background:#EFF1F3; box-shadow:none; }
.step.pending .step-t { color:var(--fg-3); }
.step-t { font-size:14.5px; font-weight:640; line-height:1.45; }
.step-det { margin-top:10px; animation:fade-up 200ms var(--ease-out) both; }
@keyframes fade-up { from { opacity:0; transform:translateY(-4px) } to { opacity:1; transform:none } }
.code { background:#14181C; color:#C9E7D6; border-radius:12px; padding:11px 13px; font-family:var(--mono); font-size:12px; line-height:1.6; overflow-x:auto; white-space:pre; scrollbar-width:none; }
.code::-webkit-scrollbar { display:none; }
.code.out { background:var(--well); color:var(--fg-2); }
.jev { border-radius:12px; overflow:hidden; background:var(--well); }
.jev-r { display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:12.5px; border-bottom:1px solid rgba(16,20,24,.05); }
.jev-r:last-child { border-bottom:0; }
.jev-k { color:var(--fg-3); flex:1 1 0; min-width:0; }
.jev-v { font-family:var(--mono); font-size:12px; font-weight:640; flex:none; }
.riskbar { display:block; width:56px; height:5px; border-radius:999px; background:#DFE3E8; overflow:hidden; flex:none; }
.riskbar > i { display:block; height:100%; background:var(--ok); }
.riskbar.hi > i { background:var(--w); }

/* ── 空态 / 骨架 ── */
.empty { padding:52px 24px; text-align:center; }
.empty-i { width:60px; height:60px; margin:0 auto 18px; border-radius:18px; display:grid; place-items:center; background:var(--card); color:var(--fg-3); box-shadow:var(--sh-1); }
.empty-t { font-size:16px; font-weight:680; }
.empty-d { margin-top:7px; font-size:14px; line-height:1.55; color:var(--fg-3); }
.skel { display:block; border-radius:10px; background:linear-gradient(90deg,#E9EBEF 25%,#F2F4F6 50%,#E9EBEF 75%); background-size:240% 100%; animation:shim 1.4s linear infinite; }
@keyframes shim { from { background-position:140% 0 } to { background-position:-40% 0 } }

/* ── 浮层 ── */
.ov { position:absolute; inset:0; z-index:16; display:none; }
.ov.is-open { display:block; }
.scrim { position:absolute; inset:0; background:rgba(12,16,20,.34); backdrop-filter:blur(2px); animation:fi 220ms var(--ease-out) both; }
@keyframes fi { from { opacity:0 } to { opacity:1 } }
.sheet { position:absolute; left:0; right:0; bottom:0; max-height:calc(100% - 44px); display:flex; flex-direction:column;
  background:#F4F5F7; border-radius:26px 26px 0 0; box-shadow:0 -14px 46px rgba(12,16,20,.30);
  animation:su 300ms var(--ease-out) both; padding-bottom:calc(var(--phone-safe-bottom) + 4px); }
@keyframes su { from { transform:translateY(22px); opacity:0 } to { transform:none; opacity:1 } }
.grab { width:38px; height:5px; border-radius:999px; background:#CFD4DA; margin:9px auto 0; flex:none; }
.sh-h { padding:12px var(--pad) 10px; flex:none; }
.sh-t { font-size:20px; font-weight:730; letter-spacing:-.025em; }
.sh-b { padding:0 var(--pad); overflow-y:auto; overscroll-behavior:contain; min-height:0; }
.sh-f { padding:14px var(--pad) 4px; flex:none; }

.faceid { position:absolute; inset:0; z-index:18; display:none; place-items:center; background:rgba(242,243,245,.93); backdrop-filter:blur(8px); }
.faceid.is-open { display:grid; animation:fi 180ms var(--ease-out) both; }
.fi-mark { width:96px; height:96px; margin:0 auto 24px; border-radius:26px; display:grid; place-items:center; background:var(--card); color:var(--ink); box-shadow:var(--sh-2); }
.faceid.scan .fi-mark { animation:pls 1.15s var(--ease-out) infinite; }
.faceid.ok .fi-mark { color:var(--ok-fg); }
@keyframes pls { 0%,100% { transform:scale(1) } 50% { transform:scale(1.05); opacity:.76 } }

.wave { display:flex; align-items:center; justify-content:center; gap:4px; height:72px; }
.wave i { display:block; width:4px; border-radius:999px; background:var(--ink); height:10px; animation:bo 900ms var(--ease-out) infinite alternate; }
@keyframes bo { from { height:7px; opacity:.35 } to { height:48px; opacity:1 } }

.toast { position:absolute; z-index:19; left:16px; right:16px; bottom:calc(var(--phone-safe-bottom) + 76px); padding:13px 16px; border-radius:16px;
  background:rgba(22,25,29,.94); color:#fff; font-size:14px; display:none; box-shadow:0 10px 30px rgba(12,16,20,.3); }
.toast.is-open { display:flex; align-items:center; gap:10px; animation:trace-in 220ms var(--ease-out) both; }

/* ═══ 进度 · 捕获 · 回放（v2.1） ═══ */
:root { --dur-sweep:1100ms; --lat-phase:70ms; }

/* StatusMark — 步骤状态圆点 */
.smark { width:22px; height:22px; display:block; }
.smark .trk { fill:none; stroke:#C3C9D0; stroke-width:1.5; stroke-dasharray:2.2 3.2; }
.smark .arc { fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round;
  stroke-dasharray:57.8; stroke-dashoffset:calc(57.8 - 57.8 * var(--p,0));
  transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset 420ms var(--ease-out); }
.smark .disc { fill:none; }
.smark .gly { fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:22; stroke-dashoffset:22; }
.step.done .smark .disc { fill:var(--ok); } .step.done .smark .gly { animation:draw 320ms var(--ease-out) forwards; }
.step.fail .smark .disc { fill:var(--d-fg); } .step.fail .smark .gly { animation:draw 320ms var(--ease-out) forwards; }
.step.wait .smark .disc { fill:var(--w); }  .step.wait .smark .gly { stroke-dashoffset:0; }
.step.done .smark .trk, .step.fail .smark .trk, .step.wait .smark .trk { stroke:none; }
@keyframes draw { to { stroke-dashoffset:0 } }

/* CallChip — 耗时芯片 */
.cchip { position:relative; display:inline-flex; align-items:center; gap:5px; overflow:hidden;
  padding:3px 9px; border-radius:999px; background:#EDEFF2; color:var(--fg-2);
  font-family:var(--mono); font-size:11px; font-weight:640; white-space:nowrap; }
.cchip > i { position:absolute; left:0; top:0; bottom:0; width:calc(var(--p,0) * 100%); background:rgba(16,20,24,.10);
  transition:width 260ms linear; }
.cchip > span { position:relative; }
.cchip.ok { background:var(--ok-wash); color:var(--ok-fg); }
.cchip.ok > i { background:rgba(15,163,92,.16); }
.cchip.bad { background:var(--w-wash); color:var(--w-fg); animation:nudge 320ms var(--ease-out) 1; }
.cchip.bad > i { background:rgba(199,122,0,.18); }
.cchip.idle { background:#F0F2F4; color:#98A2AB; }
@keyframes nudge { 0%,100% { transform:translateX(0) } 25% { transform:translateX(-3px) } 60% { transform:translateX(3px) } }

/* ThoughtLine — 计划生成 */
.tline { background:var(--card); border-radius:18px; box-shadow:var(--sh-1); padding:15px 16px; }
.tline-h { display:flex; align-items:center; gap:9px; }
.tline-g { width:16px; height:16px; flex:none; color:var(--ink); animation:breathe 1.6s var(--ease-out) infinite; }
@keyframes breathe { 0%,100% { opacity:.55; transform:scale(.94) } 50% { opacity:1; transform:scale(1) } }
.tline-t { font-size:14.5px; font-weight:650; }
.tline-c { font-family:var(--mono); font-size:12px; color:var(--fg-3); }
.tline-s { margin-top:12px; display:flex; flex-direction:column; gap:9px; }
.tline-s > span { display:block; font-size:13px; color:var(--fg-2); padding-left:14px; position:relative;
  animation:flow 260ms var(--ease-out) both; }
.tline-s > span::before { content:""; position:absolute; left:0; top:7px; width:5px; height:5px; border-radius:50%; background:#C3C9D0; }
@keyframes flow { from { opacity:0; transform:translateY(5px) } to { opacity:1; transform:none } }
.tline.fold { animation:foldin 240ms var(--ease-out) both; }
@keyframes foldin { from { opacity:.4; filter:blur(6px) } to { opacity:1; filter:none } }
.tline-sum { display:flex; align-items:center; gap:8px; width:100%; text-align:left; }

/* RefineFrame — 截图帧 / 实时画面 */
.rframe { position:relative; border-radius:14px; overflow:hidden; background:#E4E8EC; aspect-ratio:16/10; }
.rframe > .pic { position:absolute; inset:0; display:block; transition:filter 420ms var(--ease-out), transform 420ms var(--ease-out), opacity 420ms var(--ease-out); }
.rframe[data-stage="queued"]    > .pic { filter:blur(12px) saturate(.4); transform:scale(1.04); opacity:.5; }
.rframe[data-stage="capturing"] > .pic { filter:blur(7px)  saturate(.65); transform:scale(1.025); opacity:.72; }
.rframe[data-stage="parsing"]   > .pic { filter:blur(2.5px) saturate(.85); transform:scale(1.008); opacity:.9; }
.rframe[data-stage="done"]      > .pic { filter:none; transform:none; opacity:1; }
.rframe[data-stage="error"]     > .pic { filter:grayscale(.5); opacity:.45; }
.rframe .sweep { position:absolute; top:0; bottom:0; width:46%; pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.62), transparent);
  animation:sweep var(--dur-sweep) linear infinite; }
.rframe[data-stage="done"] .sweep, .rframe[data-stage="error"] .sweep { display:none; }
@keyframes sweep { from { transform:translateX(-120%) } to { transform:translateX(320%) } }
.gcur { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none;
  transition:transform 600ms cubic-bezier(.22,.61,.36,1); will-change:transform; }
.gcur > svg { position:absolute; left:-2px; top:-1px; width:15px; height:21px; display:block; }
.gcur > i { position:absolute; left:-15px; top:-15px; width:30px; height:30px; border-radius:50%;
  border:2px solid rgba(26,109,216,.9); opacity:0; }
.gcur.tap > i { animation:tapring 540ms var(--ease-out); }
@keyframes tapring { from { transform:scale(.3); opacity:.95 } to { transform:scale(1); opacity:0 } }
.rf-retry { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border-radius:999px;
  background:var(--ink); color:#fff; font-size:13px; font-weight:670; }
.rf-cap { padding:8px 12px; font-size:12px; color:var(--fg-3); background:var(--card); }

/* LatticeLoader — 实时轨执行态 */
.lat { display:grid; grid-template-columns:repeat(3,5px); gap:3px; flex:none; }
.lat i { display:block; width:5px; height:5px; border-radius:1.5px; background:var(--ink); opacity:.25;
  animation:latw 1.2s var(--ease-out) infinite; }
@keyframes latw { 0%,70%,100% { opacity:.25 } 35% { opacity:1 } }
.lat.ok i, .lat.bad i { animation:none; opacity:1; }
.lat.ok i { background:var(--ok); } .lat.bad i { background:var(--d-fg); }

/* FolderFloat — 文件夹浮出 */
.ffold { position:relative; }
.ffold-btn { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 16px; min-height:60px; }
.ffold-flap { width:40px; height:40px; border-radius:11px; display:grid; place-items:center; flex:none;
  background:#EBEEF1; color:#4E5862; transform-origin:50% 100%;
  transition:transform 260ms var(--spring), box-shadow 200ms var(--ease-out); }
.ffold.open .ffold-flap { transform:perspective(320px) rotateX(-14deg) translateY(-3px); box-shadow:0 5px 12px rgba(16,20,24,.16); }
.ffold-cloud { display:none; padding:4px 16px 14px 68px; }
.ffold.open .ffold-cloud { display:block; }
.ffold-cloud > button { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  min-height:44px; padding:9px 13px; margin-top:8px; border-radius:12px; background:var(--card);
  box-shadow:var(--sh-2); animation:spring 300ms var(--spring) both; }
@keyframes spring { from { opacity:0; transform:translateY(-10px) scale(.94) } to { opacity:1; transform:none } }

/* PromptBar — 意图输入条 */
.pbar { background:var(--card); border-radius:20px; box-shadow:var(--sh-1); padding:12px 12px 10px; }
.pbar textarea { width:100%; min-height:62px; resize:none; border:0; background:none; font-size:16.5px; line-height:1.5; color:var(--fg); }
.pbar textarea:focus { outline:none; }
.pbar textarea::placeholder { color:#A6AEB6; }
.pbar-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
.pbar-b { display:inline-flex; align-items:center; gap:5px; min-height:36px; padding:0 11px; border-radius:999px;
  background:#F0F2F4; font-size:12.5px; font-weight:640; color:var(--fg-2); flex:none; }
@media (hover:hover) { .pbar-b:hover { background:#E7EAEE; } }
.pbar-send { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none;
  background:#E9EBEF; color:#A6AEB6; transition:background 220ms var(--ease-out), color 220ms var(--ease-out), transform 160ms var(--ease-out); }
.pbar-send.charged { background:var(--ink); color:#fff; }
.pbar-send.busy { background:var(--d-fg); color:#fff; }
.pbar-send:active { transform:scale(.93); }
.pmenu { margin-top:10px; border-radius:14px; background:#F4F5F7; padding:6px; animation:fade-up 200ms var(--ease-out) both; }
.pmenu button { display:flex; align-items:center; gap:10px; width:100%; text-align:left; min-height:44px;
  padding:8px 11px; border-radius:10px; font-size:14.5px; }
@media (hover:hover) { .pmenu button:hover { background:#E9EBEF; } }

/* 实时画面 */
.rf-state { display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px;
  font-size:11px; font-weight:670; background:#E8EBEF; color:var(--fg-2); }
.rf-state.now { background:var(--ink); color:#fff; letter-spacing:.06em; }
.rf-state.bad { background:var(--d-wash); color:var(--d-fg); }
/* 揭示时刻 —— 只在真实的状态转换上出现：引导走完、索引生成完 */
.reveal { position:absolute; inset:0; z-index:40; display:none; place-items:center;
  padding:40px 34px; background:var(--bg); text-align:center; }
.reveal.is-on { display:grid; }
.reveal.is-out { animation:rv-out 260ms var(--ease-in) both; }
@keyframes rv-out { to { opacity:0 } }
.rv-in { animation:rv-focus 380ms var(--ease-out) both; }
@keyframes rv-focus { from { opacity:0; transform:scale(1.07); filter:blur(13px) }
                      to   { opacity:1; transform:none;        filter:blur(0) } }
.rv-mark { width:58px; height:58px; margin:0 auto 24px; border-radius:19px; display:grid; place-items:center;
  background:var(--ink); color:#fff; }
.rv-t { font-size:26px; font-weight:760; letter-spacing:-.03em; line-height:1.36; }
.rv-t span { display:inline-block; animation:rv-word 260ms var(--ease-out) both; }
@keyframes rv-word { from { opacity:0; transform:translateY(15px) } to { opacity:1; transform:none } }
.rv-d { margin-top:13px; font-size:14.5px; line-height:1.6; color:var(--fg-2); }

/* 上手引导 */
.ob-dots { display:flex; gap:6px; }
.ob-dots i { display:block; width:22px; height:4px; border-radius:2px; background:#D8DCE2; transition:background 200ms var(--ease-out); }
.ob-dots i.on { background:var(--ink); }
.ob-t { font-size:28px; font-weight:760; letter-spacing:-.032em; line-height:1.3; }
.ob-d { margin-top:12px; font-size:15px; line-height:1.66; color:var(--fg-2); }
.ob-vs { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.ob-vs > div { background:var(--card); border-radius:var(--r-in); padding:12px; box-shadow:var(--sh-1); }
.ob-vs h3 { font-size:12px; font-weight:680; color:var(--fg-3); margin-bottom:9px; }
.ob-squash { border-radius:7px; overflow:hidden; background:#DDE1E6; aspect-ratio:16/10;
  display:grid; place-items:center; }
.ob-squash svg { width:100%; height:100%; display:block; }
.ob-said { border-radius:7px; background:var(--ink); color:#fff; padding:11px 12px; aspect-ratio:16/10;
  display:flex; align-items:center; font-size:13px; font-weight:600; line-height:1.5; }

/* 索引 */
.ix-win { position:relative; border-radius:var(--r-in); overflow:hidden; background:#E4E8EC; aspect-ratio:16/10; }
.ix-win > .pic { position:absolute; inset:0; display:block; }
.ix-found { display:flex; flex-direction:column; gap:8px; }
.ix-found > div { animation:ix-slide 300ms var(--ease-out) both; }
@keyframes ix-slide { from { opacity:0; transform:translateY(9px) } to { opacity:1; transform:none } }
.ix-miss { font-size:12.5px; color:var(--fg-3); padding:2px 0; }
.cap-r { padding:14px 16px; border-bottom:1px solid var(--line); }
.cap-r:last-child { border-bottom:none; }
.cap-r.off { opacity:.5; }
.cap-d { width:100%; margin-top:10px; padding:9px 11px; border-radius:10px; background:#F4F6F8;
  font-size:13.5px; line-height:1.55; color:var(--fg); resize:none; font-family:inherit; }
.cap-d::placeholder { color:var(--fg-3); }
.gen-g { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gen-b { display:flex; flex-direction:column; align-items:flex-start; gap:7px; padding:15px 14px;
  border-radius:var(--r-in); background:var(--card); box-shadow:var(--sh-1); text-align:left; min-height:82px; }
.gen-b .n { font-size:14.5px; font-weight:670; letter-spacing:-.01em; }
.gen-b .m { font-size:11.5px; color:var(--fg-3); }

.scrub { display:block; width:100%; }
.scrub-tick { display:flex; gap:3px; margin-top:7px; }
.scrub-tick i { display:block; height:3px; border-radius:2px; background:#DCE0E5; flex:1 1 0; }
.scrub-tick i.on { background:var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  .rframe .sweep, .tline-g, .lat i, .gcur.tap > i { animation:none !important; }
  .gcur { transition:none !important; }
  .lat i { opacity:1 !important; }
  .smark .gly { stroke-dashoffset:0 !important; }
}
</style>

<div class="phone-frame" data-phone-shell data-platform="iphone">
  <span class="hardware-button silent" aria-hidden="true"></span>
  <span class="hardware-button volume-up" aria-hidden="true"></span>
  <span class="hardware-button volume-down" aria-hidden="true"></span>
  <span class="hardware-button power" aria-hidden="true"></span>

  <section class="phone-screen" data-phone-screen>
    <main class="phone-content" data-phone-content>
      <!-- APP CONTENT START -->
      <div class="app" id="app">

        <section class="screen od-screen" id="s-mac" aria-label="设备">
          <header class="topbar">
            <div class="od-row">
              <button class="devsw od-fill" id="devSw" aria-haspopup="dialog">
                <span class="od-field od-fill" style="text-align:left">
                  <span style="font-size:11px;letter-spacing:.04em;font-weight:620" id="devState">在线</span>
                  <span class="od-truncate" style="font-size:15px;font-weight:680;letter-spacing:-.015em" id="devName">Mac Studio</span>
                </span>
                <svg class="ico ico-sm" style="color:var(--fg-3)" aria-hidden="true"><use href="#i-chev-d"/></svg>
              </button>
              <button class="iconbtn od-fixed" id="bellBtn" aria-label="待确认操作">
                <svg class="ico" aria-hidden="true"><use href="#i-bell"/></svg>
                <span class="dot-badge" id="bellDot"></span>
              </button>
            </div>
          </header>
          <div class="od-scroll"><div class="body" id="macBody"></div></div>
        </section>

        <section class="screen od-screen" id="s-apps" aria-label="应用">
          <header class="topbar">
            <div class="od-row">
              <span class="od-spacer" style="width:44px;height:44px"></span>
              <h1 class="od-fill">应用</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
            <div style="padding:6px 10px 0">
              <label class="lbl sr-only" for="appQ">搜索应用</label>
              <div style="position:relative">
                <svg class="ico ico-sm" aria-hidden="true" style="position:absolute;left:14px;top:14px;color:var(--fg-3)"><use href="#i-search"/></svg>
                <input class="field" id="appQ" type="search" style="padding-left:40px" placeholder="搜索 Mac 上的应用" />
              </div>
            </div>
          </header>
          <div class="od-scroll"><div class="body" id="appsBody" style="padding-top:18px"></div></div>
        </section>

        <section class="screen" id="s-app" aria-label="应用控制"></section>

        <section class="screen od-screen" id="s-ob" aria-label="上手引导">
          <header class="topbar">
            <div class="od-row" style="padding:0 10px">
              <span class="ob-dots od-fill" id="obDots" aria-hidden="true"></span>
              <button class="more od-fixed" id="obSkip">跳过</button>
            </div>
          </header>
          <div class="od-scroll"><div class="body" style="padding-bottom:20px" id="obBody"></div></div>
          <div style="padding:10px var(--pad) calc(var(--phone-safe-bottom) - 12px)" id="obFoot"></div>
        </section>

        <section class="screen od-screen" id="s-index" aria-label="索引应用">
          <header class="topbar">
            <div class="od-row">
              <button class="iconbtn od-fixed" id="ixBack" aria-label="返回"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
              <h1 class="od-fill" id="ixTitle">索引应用</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
          </header>
          <div class="od-scroll"><div class="body" style="padding-bottom:20px" id="ixBody"></div></div>
          <div style="padding:10px var(--pad) calc(var(--phone-safe-bottom) - 12px)" id="ixFoot"></div>
        </section>

        <section class="screen od-screen" id="s-activity" aria-label="活动">
          <header class="topbar">
            <div class="od-row">
              <span class="od-spacer" style="width:44px;height:44px"></span>
              <h1 class="od-fill">活动</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
            <div style="padding:6px 10px 0">
              <label class="lbl sr-only" for="actQ">搜索记录</label>
              <div style="position:relative">
                <svg class="ico ico-sm" aria-hidden="true" style="position:absolute;left:14px;top:14px;color:var(--fg-3)"><use href="#i-search"/></svg>
                <input class="field" id="actQ" type="search" style="padding-left:40px" placeholder="意图、命令或设备名" />
              </div>
            </div>
          </header>
          <div class="od-scroll"><div class="body" id="actBody" style="padding-top:18px"></div></div>
        </section>

        <section class="screen od-screen" id="s-me" aria-label="我的">
          <header class="topbar">
            <div class="od-row">
              <span class="od-spacer" style="width:44px;height:44px"></span>
              <h1 class="od-fill">我的</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
          </header>
          <div class="od-scroll"><div class="body" id="meBody" style="padding-top:14px"></div></div>
        </section>

        <section class="screen od-screen" id="s-run" aria-label="执行详情">
          <header class="topbar">
            <div class="od-row">
              <button class="iconbtn od-fixed" data-back="#/activity" aria-label="返回"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
              <h1 class="od-fill" id="runTitle">执行详情</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
          </header>
          <div class="od-scroll"><div class="body-flat" id="runBody" style="padding-top:12px"></div></div>
          <div style="padding:10px var(--pad) calc(var(--phone-safe-bottom) - 12px)" id="runFoot"></div>
        </section>

        <section class="screen od-screen" id="s-devices" aria-label="设备管理">
          <header class="topbar">
            <div class="od-row">
              <button class="iconbtn od-fixed" data-back="#/me" aria-label="返回"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
              <h1 class="od-fill">设备</h1>
              <button class="iconbtn od-fixed" data-go="#/pair" aria-label="添加设备"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg></button>
            </div>
          </header>
          <div class="od-scroll"><div class="body-flat" id="devicesBody" style="padding-top:14px"></div></div>
        </section>

        <section class="screen od-screen" id="s-device" aria-label="设备详情">
          <header class="topbar">
            <div class="od-row">
              <button class="iconbtn od-fixed" data-back="#/devices" aria-label="返回"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
              <h1 class="od-fill" id="deviceTitle">设备</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
          </header>
          <div class="od-scroll"><div class="body-flat" id="deviceBody" style="padding-top:14px"></div></div>
        </section>

        <section class="screen od-screen" id="s-pair" aria-label="添加设备">
          <header class="topbar">
            <div class="od-row">
              <button class="iconbtn od-fixed" data-back="#/devices" aria-label="返回"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
              <h1 class="od-fill">添加设备</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
          </header>
          <div class="od-scroll"><div class="body-flat" id="pairBody" style="padding-top:14px"></div></div>
        </section>

        <section class="screen od-screen" id="s-live" aria-label="实时画面">
          <header class="topbar">
            <div class="od-row">
              <button class="iconbtn od-fixed" id="liveBack" aria-label="返回"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
              <h1 class="od-fill" id="liveTitle">实时画面</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
          </header>
          <div class="od-scroll"><div class="body-flat" id="liveBody" style="padding-top:14px"></div></div>
        </section>

        <section class="screen od-screen" id="s-shortcuts" aria-label="快捷指令">
          <header class="topbar">
            <div class="od-row">
              <button class="iconbtn od-fixed" data-back="#/me" aria-label="返回"><svg class="ico" aria-hidden="true"><use href="#i-back"/></svg></button>
              <h1 class="od-fill">快捷指令</h1>
              <span class="od-spacer" style="width:44px;height:44px"></span>
            </div>
          </header>
          <div class="od-scroll"><div class="body-flat" id="scBody" style="padding-top:14px"></div></div>
        </section>

      </div>
      <!-- APP CONTENT END -->
    </main>

    <div class="navdock" id="dock">
      <nav class="tabbar glass" aria-label="主导航">
        <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
        <button class="tab" data-tab="mac" data-go="#/mac"><svg class="ico" aria-hidden="true"><use href="#i-mac"/></svg><span class="tab-label">设备</span></button>
        <button class="tab" data-tab="apps" data-go="#/apps"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg><span class="tab-label">应用</span></button>
        <button class="tab" data-tab="activity" data-go="#/activity"><svg class="ico" aria-hidden="true"><use href="#i-pulse"/></svg><span class="tab-label">活动</span></button>
        <button class="tab" data-tab="me" data-go="#/me"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg><span class="tab-label">我的</span></button>
      </nav>
      <button class="composebtn glass" id="composeBtn" aria-label="让 Mac 做一件事">
        <svg class="ico ico-lg" aria-hidden="true"><use href="#i-spark"/></svg>
      </button>
    </div>

    <div class="reveal" id="reveal" role="status" aria-live="polite"></div>
    <div class="trace glass" id="trace" role="status" aria-live="polite"></div>

    <div class="ov" id="sheetLayer" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="scrim" data-close-sheet></div>
      <div class="sheet">
        <span class="grab" aria-hidden="true"></span>
        <div class="sh-h">
          <div class="od-row">
            <h2 class="sh-t od-fill" id="sheetTitle">标题</h2>
            <button class="iconbtn od-fixed" data-close-sheet aria-label="关闭"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button>
          </div>
        </div>
        <div class="sh-b" id="sheetBody"></div>
        <div class="sh-f" id="sheetFoot"></div>
      </div>
    </div>

    <div class="faceid" id="faceid" role="dialog" aria-modal="true" aria-labelledby="fiTitle">
      <div style="text-align:center;padding:0 40px">
        <div class="fi-mark"><svg class="ico" style="width:48px;height:48px" aria-hidden="true"><use href="#i-face"/></svg></div>
        <p class="display" style="font-size:22px" id="fiTitle">面容 ID</p>
        <p class="sub" id="fiDesc">正在验证你的身份…</p>
        <button class="btn btn-ghost" id="fiCancel" style="margin-top:26px">取消</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ═════════ 工具 ═════════ */
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic = (n,c) => `<svg class="ico ${c||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const LV = [{t:'只读',c:'b-l0'},{t:'写入',c:'b-l1'},{t:'系统级',c:'b-l2'}];
const lvB = lv => `<span class="badge ${LV[lv].c}"><span class="d" aria-hidden="true"></span>Level ${lv} ${LV[lv].t}</span>`;
const mmss = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');

let toastT = null;
/* 揭示时刻：目标界面先渲染好垫在底下，这一层聚焦 → 出字 → 退场，界面就留在那儿了。
   只在真的完成了一件事时调用，不做氛围装饰。 */
function revealNow(o) {
  const el = $('#reveal');
  const w = o.t.split('|');
  el.innerHTML = `<div class="rv-in">
    <span class="rv-mark" aria-hidden="true">${ic(o.g || 'check','ico-lg')}</span>
    <p class="rv-t">${w.map((x, k) => `<span style="animation-delay:${340 + k * 40}ms">${esc(x)}</span>`).join('')}</p>
    <p class="rv-d" style="animation:rv-word 260ms ${380 + w.length * 40}ms var(--ease-out) both">${esc(o.d)}</p>
  </div>`;
  el.classList.add('is-on');
  setTimeout(() => {
    el.classList.add('is-out');
    setTimeout(() => { el.className = 'reveal'; el.innerHTML = ''; if (o.then) o.then(); }, 260);
  }, 380 + w.length * 40 + 260 + 520);
}

function toast(msg, icon) {
  const el = $('#toast');
  el.innerHTML = ic(icon||'check','ico-sm') + `<span class="od-fill">${esc(msg)}</span>`;
  el.classList.add('is-open');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('is-open'), 2600);
}

/* ═════════ 路由 ═════════ */
const SCREENS = {
  mac:      { el:'s-mac',       tab:'mac' },
  apps:     { el:'s-apps',      tab:'apps' },
  app:      { el:'s-app',       tab:'apps' },
  activity: { el:'s-activity',  tab:'activity' },
  me:       { el:'s-me',        tab:'me' },
  run:      { el:'s-run',       tab:'activity', deep:true },
  devices:  { el:'s-devices',   tab:'me',       deep:true },
  device:   { el:'s-device',    tab:'me',       deep:true },
  pair:     { el:'s-pair',      tab:'me',       deep:true },
  shortcuts:{ el:'s-shortcuts', tab:'me',       deep:true },
  live:     { el:'s-live',      tab:'activity', deep:true },
  welcome:  { el:'s-ob',        tab:'mac',      deep:true },
  index:    { el:'s-index',     tab:'apps',     deep:true }
};
const TABI = { mac:0, apps:1, activity:2, me:3 };
const scrollMem = {};
let current = null, currentKey = null;

const parseHash = () => {
  const parts = (location.hash || '#/mac').replace(/^#\/?/, '').split('/').filter(Boolean);
  return { name: parts[0] || 'mac', param: parts[1] || null, sub: parts[2] || null };
};
const go = h => { location.hash = h; };

function render() {
  const { name, param, sub } = parseHash();
  const conf = SCREENS[name] || SCREENS.mac;
  if (current) {
    const prev = $('#' + SCREENS[current].el + ' .od-scroll');
    if (prev && currentKey) scrollMem[currentKey] = prev.scrollTop;
  }
  if (name === 'mac') renderMac();
  else if (name === 'apps') renderApps();
  else if (name === 'app') renderAppSurface(param, sub);
  else if (name === 'activity') renderActivity();
  else if (name === 'me') renderMe();
  else if (name === 'run') renderRun(param || STATE.activeRun);
  else if (name === 'devices') renderDevices();
  else if (name === 'device') renderDevice(param || STATE.device);
  else if (name === 'pair') renderPair();
  else if (name === 'shortcuts') renderShortcuts();
  else if (name === 'live') renderLive(param);
  else if (name === 'welcome') renderOb();
  else if (name === 'index') renderIndex(param);

  $$('.screen').forEach(s => s.classList.remove('is-active'));
  const el = $('#' + conf.el);
  el.classList.add('is-active');

  $('#dock').classList.toggle('is-hidden', !!conf.deep);
  $('#tabInd').style.setProperty('--ti', TABI[conf.tab]);
  $$('.tab').forEach(t => {
    if (t.dataset.tab === conf.tab) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
  });

  const key = name + (param ? '/' + param : '');
  const sc = $('.od-scroll', el);
  if (sc) sc.scrollTop = (key === currentKey) ? sc.scrollTop : (scrollMem[key] || 0);
  current = name; currentKey = key;
}
window.addEventListener('hashchange', render);

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');    if (g) { go(g.dataset.go); return; }
  if (e.target.closest('#liveBack')) { go($('#liveBack').dataset.back || '#/mac'); return; }
  const b = e.target.closest('[data-back]');  if (b) { go(b.dataset.back); return; }
  if (e.target.closest('[data-close-sheet]')) closeSheet();
});

/* ═════════ 浮层 ═════════ */
let sheetClose = null;
function openSheet(title, body, foot, onClose) {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  $('#sheetFoot').innerHTML = foot || '';
  $('#sheetLayer').classList.add('is-open');
  sheetClose = onClose || null;
  const f = $('#sheetBody button, #sheetBody input, #sheetFoot button');
  if (f) f.focus();
}
function closeSheet() {
  $('#sheetLayer').classList.remove('is-open');
  const cb = sheetClose; sheetClose = null; if (cb) cb();
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#faceid').classList.contains('is-open')) return closeFace();
  if ($('#sheetLayer').classList.contains('is-open')) closeSheet();
});

let faceT = null;
function openFace(onOk) {
  const box = $('#faceid');
  box.className = 'faceid is-open scan';
  $('#fiTitle').textContent = '面容 ID';
  $('#fiDesc').textContent = '正在验证你的身份…';
  $('#fiCancel').hidden = false;
  faceT = setTimeout(() => {
    box.className = 'faceid is-open ok';
    $('#fiTitle').textContent = '验证通过';
    $('#fiDesc').textContent = '已授权本次 Level 2 操作';

}
function closeFace() { clearTimeout(faceT); $('#faceid').className = 'faceid'; }
$('#fiCancel').addEventListener('click', () => { closeFace(); toast('已取消验证，操作未执行','alert'); });

/* ═════════ Computer Use 实时轨 ═════════ */
let traceT = null;
function hideTrace(now) {
  clearTimeout(traceT);
  const el = $('#trace');
  if (now) el.classList.remove('is-open');
  else traceT = setTimeout(() => el.classList.remove('is-open'), 2900);
}
function paintTrace(o) {
  const el = $('#trace');
  const cells = '<i></i>'.repeat(9);
  const head = o.state === 'run'
    ? `<span class="lat" aria-hidden="true">${Array.from({length:9},(_,k)=>`<i style="animation-delay:${k*70}ms"></i>`).join('')}</span>
       <span class="trace-t od-fill">正在操控 ${esc(o.app)}</span>
       <span class="trace-c od-nowrap js-sw" style="margin:0">0.0s</span>`
    : o.state === 'ok'
      ? `<span class="lat ok" aria-hidden="true">${cells}</span><span class="trace-t od-fill">${esc(o.note ? o.app + " · " + o.note : o.app + " · 已完成")}</span>`
      : `<span class="lat bad" aria-hidden="true">${cells}</span><span class="trace-t od-fill">${esc(o.app)} · ${esc(o.headline || '被拦下')}</span>`;
  el.innerHTML = `<div class="trace-h">${head}<span class="od-fixed chan${o.ch==='Cua Driver'?' g':''}">${esc(o.ch)}</span></div>
    <p class="trace-c">${esc(o.cmd)}</p>
    <p class="trace-m">
      <span class="badge ${LV[o.lv].c}" style="padding:2px 7px;font-size:10.5px"><span class="d" aria-hidden="true"></span>L${o.lv} ${LV[o.lv].t}</span>
      <span>Jev ${esc(o.jd)}</span><span aria-hidden="true">·</span>
      <span class="mono od-nowrap">置信度 ${o.c.toFixed(2)}</span><span aria-hidden="true">·</span>
      <span class="mono od-nowrap">${o.ms}ms</span>
    </p>`;
  el.classList.add('is-open');
  clearInterval(swTick);
  if (o.state === 'run') {
    const t0 = Date.now();
    swTick = setInterval(() => {
      const sw = $('.js-sw', el); if (!sw) { clearInterval(swTick); return; }
      sw.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
    }, 100);
  }
}
let swTick = null;

/* act: {app, ch, lv, cmd, jev:{d,r,c,ms}, gate?, ok, done()} */
function runAction(act) {
  clearTimeout(traceT);
  paintTrace({ state:'run', app:act.app, ch:act.ch, lv:act.lv, cmd:act.cmd, jd:'评估中', c:0, ms:0 });
  setTimeout(() => {
    if (act.gate) {
      paintTrace({ state:'bad', app:act.app, ch:act.ch, lv:act.lv, cmd:act.cmd, jd:act.jev.d, c:act.jev.c, ms:act.jev.ms, headline:'等待你确认' });
      openApproval(act);
      return;
    }
    paintTrace({ state:'ok', app:act.app, ch:act.ch, lv:act.lv, cmd:act.cmd, jd:act.jev.d, c:act.jev.c, ms:act.jev.ms, note:act.ok });
    hideTrace();
    if (act.done) act.done();
  }, 620);
}

function openApproval(act) {
  const g = act.gate, isL2 = act.lv === 2;
  openSheet(isL2 ? '需要你确认' : '风险高于阈值', `
    <div class="od-cluster" style="--od-gap:8px;margin-bottom:14px">
      ${lvB(act.lv)}
      <span class="badge ${isL2 ? 'b-l2' : 'b-l1'}">${isL2 ? '强制手机确认' : '超过风险阈值'}</span>
    </div>
    <p style="font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.4">${esc(act.title || act.app)}</p>
    <p class="sub" style="font-size:14px">${esc(g.why)}</p>
    <p class="sec" style="margin:20px 0 9px"><span style="font-size:13px;font-weight:700">将要执行</span></p>
    <pre class="code">${esc(act.cmd)}</pre>
    <p class="sec" style="margin:18px 0 9px"><span style="font-size:13px;font-weight:700">影响范围</span></p>
    <div class="card" style="padding:14px 15px"><p style="font-size:14px;line-height:1.55">${esc(g.scope)}</p></div>
    <p class="sec" style="margin:18px 0 9px"><span style="font-size:13px;font-weight:700">Jev 预检结果</span></p>
    <div class="jev" style="background:#fff;box-shadow:var(--sh-1);margin-bottom:6px">
      <div class="jev-r"><span class="jev-k">操作分级</span><span class="jev-v" style="color:${isL2?'var(--d-fg)':'var(--w-fg)'}">Level ${act.lv} ${LV[act.lv].t}</span></div>
      <div class="jev-r"><span class="jev-k">匹配原始意图</span><span class="jev-v" style="color:var(--ok-fg)">true</span></div>
      <div class="jev-r"><span class="jev-k">不可逆风险</span><span class="riskbar${act.jev.r>STATE.thr?' hi':''}" aria-hidden="true"><i style="width:${Math.round(act.jev.r*100)}%"></i></span><span class="jev-v">${act.jev.r.toFixed(2)}</span></div>
      <div class="jev-r"><span class="jev-k">置信度</span><span class="jev-v">${act.jev.c.toFixed(2)}（阈值 ${STATE.thr.toFixed(2)}）</span></div>
      <div class="jev-r"><span class="jev-k">返回耗时</span><span class="jev-v od-nowrap">${act.jev.ms}ms</span></div>
    </div>
    <p class="hint" style="margin-bottom:10px">拒绝后这一步不会执行，设备上不会有任何改动。</p>`,
    `<div class="od-stack" style="--od-gap:10px">
      <button class="btn btn-primary btn-block" id="apOk">${isL2 ? ic('face','ico-sm') + '<span>面容 ID 确认执行</span>' : '<span>确认执行</span>'}</button>
      <button class="btn btn-danger btn-block" id="apNo">拒绝</button>
    </div>`);
  $('#apOk').addEventListener('click', () => {
    closeSheet();
    const finish = () => {
      paintTrace({ state:'ok', app:act.app, ch:act.ch, lv:act.lv, cmd:act.cmd, jd:'已授权', c:act.jev.c, ms:act.jev.ms, note:act.ok });
      hideTrace();
      if (act.done) act.done();
    };
    if (isL2) openFace(finish); else finish();
  });
  $('#apNo').addEventListener('click', () => {
    closeSheet(); hideTrace(true);
    toast('已拒绝，操作未执行', 'x');
    if (act.rejected) act.rejected();
  });
}

/* ═════════ 索引一个本地应用 ═════════ */
const IX = { id:null, phase:'intro', found:[], log:[], i:0, t0:0, timer:null, on:{}, ask:{}, desc:{} };
const MISS_HIT = [[20,10],[92,48],[8,64]];

function ixProbes(id) {
  const caps = CAPS[id] || [], ms = MISSES[id] || [];
  const out = []; let mi = 0;
  caps.forEach((c, k) => {
    out.push({ cap:c });
    if ((k === 1 || k === 3) && mi < ms.length) { out.push({ miss:ms[mi], hit:MISS_HIT[mi % 3] }); mi += 1; }
  });
  return out;
}

function ixStart(id) {
  IX.id = id; IX.phase = 'intro'; IX.found = []; IX.log = []; IX.i = 0;
  IX.on = {}; IX.ask = {}; IX.desc = {};
  (CAPS[id] || []).forEach(c => { IX.on[c.id] = true; IX.ask[c.id] = c.lv === 2; IX.desc[c.id] = ''; });
  clearInterval(IX.timer);
}

function renderIndex(id) {
  const a = appById(id);
  if (!a || !CAPS[id]) { go('#/apps'); return; }
  if (IX.id !== id) ixStart(id);
  $('#ixTitle').textContent = IX.phase === 'caps' ? '能力清单' : '索引 ' + a.name;
  $('#ixBack').dataset.back = '#/apps';

  if (IX.phase === 'intro') return ixIntro(a);
  if (IX.phase === 'scan') return ixScan(a);
  return ixCaps(a);
}

function ixIntro(a) {
  $('#ixBody').innerHTML = `
    <div class="card">
      <p class="od-row" style="--od-gap:12px">
        <span class="apptile${a.run ? ' run' : ''} od-fixed" aria-hidden="true">${ic(a.g)}</span>
        <span class="od-field od-fill" style="--od-gap:3px">
          <span class="row-t">${esc(a.name)}</span>
          <span class="row-d mono od-truncate">${esc(a.bundle)}</span>
        </span>

      </p>
    </div>

    <div>
      <div class="sec"><h2>索引会做什么</h2></div>
      <div class="card card-flush">
        ${[['search','逐个点开菜单和面板','Cua Driver 把窗口里的控件树读一遍'],
           ['list','把能操作的东西列出来','每一项标上 Jev 给的分级'],
           ['edit','你来确认和补描述','写清楚这项是干嘛的，调度层才知道该点哪'],
           ['grid','照着清单生成界面','之后在手机上直接点，不用再写意图']].map(x => `
          <div class="row" style="cursor:default;align-items:flex-start;padding-top:13px;padding-bottom:13px">

            <span class="od-field od-fill" style="--od-gap:3px"><span class="row-t" style="font-size:14.5px">${esc(x[1])}</span>
            <span class="row-d">${esc(x[2])}</span></span>
          </div>`).join('')}
      </div>
    </div>

    <div class="notice" style="background:var(--ok-wash)">
      ${ic('shield')}
      <span class="od-fill">
        <span class="n-t" style="color:var(--ok-fg)">探索全程只做 Level 0</span>
        <span class="n-d">只打开菜单、读控件名，不会点下任何会改东西的按钮。摸到写操作只登记名字和分级，不触发。${esc(a.name)} 里的文件在这一步不会有任何改动。</span>

function ixScan(a) {
  const probes = ixProbes(a.id);
  $('#ixBody').innerHTML = `
    <div style="border-radius:var(--r-in);overflow:hidden;box-shadow:var(--sh-1)">
      <div class="ix-win" id="ixWin">
        <span class="pic">${a.id === 'figma' ? SHOT_FIGMA : SHOT_MAC}</span>
        <span class="gcur" aria-hidden="true" style="transform:translate(50%,50%)">${CURSOR}<i></i></span>
      </div>
      <p class="rf-cap od-row" style="--od-gap:8px">
        ${rstate('索引中','now')}
        <span class="od-fill" id="ixWhere">正在唤起 ${esc(a.name)}</span>
        <span class="od-fixed od-nowrap">${esc(a.name)}</span>
      </p>
    </div>

    <div class="card">
      <p class="od-row" style="--od-gap:10px">
        <span class="lat od-fixed" aria-hidden="true">${Array.from({length:9},(_,k)=>`<i style="animation-delay:${k*70}ms"></i>`).join('')}</span>
        <span class="od-fill" style="font-size:13.5px;font-weight:660" id="ixCount">已探查 0 处 · 发现 0 项能力</span>
        <span class="od-fixed mono od-nowrap" style="font-size:12px;color:var(--fg-3)" id="ixSw">0.0s</span>
      </p>
      <div class="mini" style="height:5px;margin-top:12px"><i id="ixBar" style="width:0%;background:var(--ink)"></i></div>
    </div>

    <div>
      <div class="sec"><h2>摸到的能力</h2></div>
      <div class="ix-found" id="ixFound"></div>
    </div>`;
  $('#ixFoot').innerHTML = `<button class="btn btn-well btn-block" id="ixStop">停下</button>`;
  $('#ixStop').addEventListener('click', () => { clearInterval(IX.timer); clearInterval(IX.sw); go('#/apps'); });

  clearInterval(IX.sw);
  IX.sw = setInterval(() => {
    const el = $('#ixSw'); if (!el) { clearInterval(IX.sw); return; }
    el.textContent = ((Date.now() - IX.t0) / 1000).toFixed(1) + 's';
  }, 100);

  clearInterval(IX.timer);
  const step = () => {
    const box = $('#ixFound');
    if (!box || parseHash().name !== 'index') { clearInterval(IX.timer); clearInterval(IX.sw); return; }
    if (IX.i >= probes.length) {
      clearInterval(IX.timer); clearInterval(IX.sw);
      IX.secs = ((Date.now() - IX.t0) / 1000).toFixed(1);
      IX.phase = 'caps'; renderIndex(IX.id);
      return;
    }
    const pr = probes[IX.i]; IX.i += 1;
    const hit = pr.cap ? pr.cap.hit : pr.hit;
    const cur = $('#ixWin .gcur');
    if (cur) {
      cur.style.transform = `translate(${hit[0]}%,${hit[1]}%)`;
      setTimeout(() => { const c = $('#ixWin .gcur'); if (c) { c.classList.remove('tap'); void c.offsetWidth; c.classList.add('tap'); } }, 430);
    }
    $('#ixWhere').textContent = '点开 ' + (pr.cap ? pr.cap.menu : pr.miss.split('（')[0]);
    if (pr.cap) IX.found.push(pr.cap);
    box.insertAdjacentHTML('beforeend', pr.cap
      ? `<div class="card" style="padding:13px 15px">
          <p class="od-row" style="--od-gap:9px">
            <span class="od-fixed" style="color:var(--ok-fg)" aria-hidden="true">${ic('check','ico-sm')}</span>
            <span class="od-field od-fill" style="--od-gap:3px">
              <span class="row-t" style="font-size:14.5px">${esc(pr.cap.n)}</span>
              <span class="row-d od-truncate">${esc(pr.cap.menu)}</span>
            </span>
            <span class="badge ${LV[pr.cap.lv].c} od-fixed" style="padding:2px 7px;font-size:10.5px"><span class="d" aria-hidden="true"></span>L${pr.cap.lv}</span>
          </p>
        </div>`
      : `<p class="ix-miss">${ic('x','ico-sm')} ${esc(pr.miss)}</p>`);
    $('#ixCount').textContent = `已探查 ${IX.i} 处 · 发现 ${IX.found.length} 项能力`;
    $('#ixBar').style.width = Math.round(IX.i / probes.length * 100) + '%';
  };
  step();
  IX.timer = setInterval(step, 900);
}

function ixCaps(a) {
  const caps = CAPS[a.id];
  const onCount = caps.filter(c => IX.on[c.id]).length;
  $('#ixBody').innerHTML = `
    <div>
      <h1 class="ob-t" style="font-size:24px">摸到 ${caps.length} 项能力</h1>
      <p class="ob-d" style="font-size:14.5px">用了 ${esc(IX.secs || '0.0')}s。关掉你不想让它碰的，给留下的写一句描述——描述是给调度层看的，你写得越像人话，它越知道该点哪。</p>
    </div>

    <div class="card card-flush">
      ${caps.map(c => `<div class="cap-r${IX.on[c.id] ? '' : ' off'}" data-cap="${c.id}">
        <div class="od-row" style="--od-gap:10px">
          <span class="od-field od-fill" style="--od-gap:4px">
            <span class="row-t">${esc(c.n)}</span>
            <span class="row-d od-truncate">${esc(c.menu)}</span>
          </span>
          <span class="badge ${LV[c.lv].c} od-fixed" style="padding:2px 7px;font-size:10.5px"><span class="d" aria-hidden="true"></span>L${c.lv} ${LV[c.lv].t}</span>
          <button class="switch od-fixed" role="switch" aria-checked="${IX.on[c.id]}" data-on="${c.id}" aria-label="启用${esc(c.n)}"></button>
        </div>
        ${IX.on[c.id] ? `
          <label class="sr-only" for="cd-${c.id}">${esc(c.n)}的描述</label>
          <textarea class="cap-d" id="cd-${c.id}" rows="2" data-desc="${c.id}"
            placeholder="用你平时会说的话描述这个功能">${esc(IX.desc[c.id] || '')}</textarea>
          ${c.lv === 2
            ? `<p class="hint" style="margin-top:8px">${ic('shield','ico-sm')} Level 2 每次都会要你确认，这条关不掉。</p>`
            : `<button class="more" style="margin-top:8px;font-size:12.5px" data-ask="${c.id}">${IX.ask[c.id] ? '每次都问我 · 已开' : '按 Jev 的判定自动执行'}</button>`}
        ` : ''}
      </div>`).join('')}
    </div>

    <p class="hint">关掉的能力不会写进这个应用的清单，daemon 也不会去点它。之后随时可以重新索引。</p>`;
  $('#ixFoot').innerHTML = `<button class="btn btn-primary btn-block" id="ixGen"${onCount ? '' : ' disabled'}>${ic('spark','ico-sm')}<span>生成简化界面（${onCount} 项）</span></button>`;

  $$('#ixBody [data-on]').forEach(b => b.addEventListener('click', () => {
    IX.on[b.dataset.on] = !IX.on[b.dataset.on]; ixCaps(a);
  }));
  $$('#ixBody [data-ask]').forEach(b => b.addEventListener('click', () => {
    IX.ask[b.dataset.ask] = !IX.ask[b.dataset.ask]; ixCaps(a);
  }));
  $$('#ixBody [data-desc]').forEach(t => t.addEventListener('input', () => { IX.desc[t.dataset.desc] = t.value; }));
  $('#ixGen').addEventListener('click', () => ixGenerate(a));
}

function ixGenerate(a) {
  a.caps = CAPS[a.id].filter(c => IX.on[c.id]).map(c => Object.assign({}, c, {
    d: (IX.desc[c.id] || '').trim(),
    ask: c.lv === 2 ? true : !!IX.ask[c.id]
  }));
  a.kind = 'mine';
  a.indexedAt = '刚刚';
  if (!a.ch.includes('Cua Driver')) a.ch.push('Cua Driver');
  IX.id = null;
  go('#/app/' + a.id);
  revealNow({ g:a.g, t:`你的 ${a.name}，|已就位`, d:`${a.caps.length} 项能力已经接上，直接在这儿点就行。` });
}

function openApp(id) {
  const a = appById(id);
  if (!a) return;
  if (a.kind === 'blocked') { toast('1Password 已被白名单排除，无法操作', 'lock'); return; }
  if (a.kind === 'cli') { openCompose('在终端里执行：'); return; }
  if (a.kind === 'unindexed') { go('#/index/' + id); return; }
  go('#/app/' + id);
}

function renderApps() {

            <span class="row-d mono od-truncate">${esc(a.bundle)}</span>
            ${a.why ? `<span class="row-d">${esc(a.why)}</span>`
              : a.kind === 'unindexed' ? `<span class="row-d">点一下，让 Computer Use 走一遍它的菜单</span>`
              : `<span class="od-cluster" style="--od-gap:5px;margin-top:2px">${a.ch.map(c => `<span class="chan${c === 'Cua Driver' ? ' g' : ''}">${esc(c)}</span>`).join('')}</span>`}
          </span>
          <span class="od-fixed mono od-nowrap" style="font-size:12px;color:var(--fg-3)">${a.run ? esc(a.mem) : '未运行'}</span>

      </span>

    </button>

  $$('#appsBody [data-app]').forEach(b => b.addEventListener('click', () => openApp(b.dataset.app)));

function openAddApp() {
  const rest = MORE_APPS.filter(m => !appById(m.id));
  openSheet('添加应用', rest.length ? `
    <div class="card card-flush">

    : `<div class="empty" style="padding:34px 20px">

function renderAppSurface(id, sub) {
  const a = appById(id);
  const scr = $('#s-app');

  if (a.kind === 'unindexed') { go('#/index/' + a.id); return; }

  else scr.innerHTML = appShell(a, genHTML(a), (a.caps || []).length + ' 项能力 · 由你索引');
  bindAppSurface(a, sub);
}

function bindMusic() {

  $$('#appBody [data-m]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.m, tr = TRACKS[m.i];

      runAction({ app:'音乐', ch:'AppleScript', lv:1, cmd:'tell application "Music" to playpause',
        jev:{d:'放行',r:0.02,c:0.98,ms:84}, done:() => { m.playing = !m.playing; redraw(); },
        ok: m.playing ? '已暂停' : '正在播放 ' + tr.t });
    } else if (k === 'next') {
      runAction({ app:'音乐', ch:'AppleScript', lv:1, cmd:'tell application "Music" to next track',
        jev:{d:'放行',r:0.02,c:0.97,ms:79}, done:() => { m.i = (m.i + 1) % TRACKS.length; m.pos = 0; m.playing = true; redraw(); },

        jev:{d:'放行',r:0.01,c:0.99,ms:68}, ok:'音量已设为 ' + v });

  $$('#appBody [data-track]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.track, t = TRACKS[i];

      jev:{d:'放行',r:0.03,c:0.96,ms:92}, done:() => { m.i = i; m.pos = 0; m.playing = true; redraw(); },
      ok:'正在播放 ' + t.t });
