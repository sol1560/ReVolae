  list.forEach(r => { const g = r.when.startsWith('昨天') ? '昨天' : /月/.test(r.when) ? r.when : '今天'; (groups[g] = groups[g] || []).push(r); });

  body.innerHTML = Object.keys(groups).map(g => `<div>
    <div class="sec"><h2>${esc(g)}</h2></div>
    <div class="card card-flush">${groups[g].map(runRow).join('')}</div>
  </div>`).join('');
}

function runRow(r) {
  const s = RS[r.status];
  return `<button class="row od-row-top" style="align-items:flex-start" data-go="#/run/${r.id}">
    <span class="od-fixed" style="width:26px;height:26px;border-radius:9px;display:grid;place-items:center;margin-top:2px;background:${s.c};color:#fff" aria-hidden="true">${ic(s.i,'ico-sm')}</span>
    <span class="od-field od-fill" style="--od-gap:5px">
      <span class="row-t od-clamp-2">${esc(r.intent)}</span>
      <span class="row-d od-cluster" style="--od-gap:7px">
        <span>${esc(s.t)}</span><span aria-hidden="true">·</span>
        <span>${esc(DEVICES[r.device].name)}</span><span aria-hidden="true">·</span>
        <span class="mono od-nowrap">${esc(r.started)}</span><span aria-hidden="true">·</span>
        <span class="mono od-nowrap">${esc(r.credit)} credit</span>
      </span>
    </span>
    <span class="chev" style="margin-top:4px" aria-hidden="true">${ic('chev-r','ico-sm')}</span>
  </button>`;
}

let actQT = null;
$('#actQ').addEventListener('input', e => { STATE.actQ = e.target.value; clearTimeout(actQT); actQT = setTimeout(renderActivity, 150); });

/* ═════════ 执行详情 ═════════ */
function renderRun(id) {
  const run = RUNS[id] || RUNS[STATE.activeRun];
  if (!run) { go('#/activity'); return; }
  STATE.activeRun = run.id;
  const s = RS[run.status];
  $('#runTitle').textContent = s.t;
  const done = run.steps.filter(x => x.st === 'done').length, total = run.steps.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const caps = run.steps.filter(x => x.cap === 'done').length;

  if (run.planning) {
    $('#runTitle').textContent = '生成计划';
    $('#runBody').innerHTML = `
      <div class="card" style="margin-bottom:20px">
        <p style="font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.42">${esc(run.intent)}</p></div>
      <div class="tline" id="tline" aria-live="polite">
        <div class="tline-h">
          <span class="tline-g" aria-hidden="true">${ic('spark','ico-sm')}</span>
          <span class="tline-t od-fill">正在生成执行计划</span>
          <span class="tline-c od-nowrap" id="tclock">${((Date.now() - (run.t0 || Date.now())) / 1000).toFixed(1)}s</span>
        </div>
        <div class="tline-s" id="tsteps">${run.steps.slice(0, run.pn || 0).map(x => `<span>${esc(x.t)}</span>`).join('')}</div>
      </div>`;
    $('#runFoot').innerHTML = '';
    return;
  }

  $('#runBody').innerHTML = `
    ${run.plannedIn ? `<div class="tline fold" style="margin-bottom:12px">
      <button class="tline-sum" id="tfold" aria-expanded="false">
        <span aria-hidden="true" style="color:var(--fg-3)">${ic('spark','ico-sm')}</span>
        <span class="od-fill" style="font-size:13.5px;color:var(--fg-2)">已想好 ${run.plannedIn}s · ${run.steps.length} 步</span>
        <span class="chev" aria-hidden="true">${ic('chev-d','ico-sm')}</span>
      </button>
      <div class="tline-s" id="tfoldbox" hidden>${run.steps.map(x => `<span>${esc(x.t)}</span>`).join('')}</div>
    </div>` : ''}
    <div class="card" style="margin-bottom:20px">
      <p style="font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.42">${esc(run.intent)}</p>
      <p class="od-cluster" style="--od-gap:7px;margin-top:10px;font-size:12px;color:var(--fg-3)">
        <span>${esc(DEVICES[run.device].name)}</span><span aria-hidden="true">·</span>
        <span>${esc(run.model)}</span><span aria-hidden="true">·</span>
        <span class="mono od-nowrap">${esc(run.started)} 开始</span>
      </p>
      <div class="od-row" style="margin-top:14px">
        <span class="od-fill" style="font-size:13px;color:var(--fg-2)">${esc(s.t)}</span>
        <span class="od-fixed mono od-nowrap" style="font-size:12px;color:var(--fg-3)">${total ? done + '/' + total + ' 步' : '无计划'}</span>
      </div>
      <div class="mini" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="执行进度" style="height:6px">
        <i style="width:${pct}%;background:${s.c}"></i>
      </div>
    </div>

    ${(run.status === 'running' && REC.live !== 'off') ? (() => {
      const sc = liveScene(run.steps[run.at]);
      return `<div style="margin-bottom:20px">
      <div class="sec"><h2>实时画面</h2><button class="more" data-go="#/live/${run.id}">放大</button></div>
      <div style="border-radius:14px;overflow:hidden;box-shadow:var(--sh-1)">
        ${rframe('done', sc.svg, { cursor:!!sc.hit, id:'liveMini' })}
        <p class="rf-cap od-row" style="--od-gap:8px">
          ${rstate('LIVE','now')}
          <span class="od-fill" id="liveMeta" data-jit="1">${LIVE.fps} fps · 延迟 ${LIVE.ms}ms</span>
          <span class="od-fixed od-nowrap">${esc(sc.app)}</span>
        </p>
      </div>
    </div>`; })() : ''}

    ${(run.status !== 'running' && REC.live !== 'off' && caps) ? `<div style="margin-bottom:20px">
      <div class="sec"><h2>画面回放</h2><span class="hint od-nowrap">${caps} 帧</span></div>
      <div class="card card-flush">
        <button class="row" data-go="#/live/${run.id}" style="border-bottom:none">
          <span class="od-fixed" style="color:var(--fg-3)" aria-hidden="true">${ic('img')}</span>
          <span class="od-field od-fill" style="--od-gap:3px">
            <span class="row-t">按步回看这次任务的画面</span>
            <span class="row-d">拖滑杆在 ${caps} 帧之间来回</span>
          </span>
          <span class="chev" aria-hidden="true">${ic('chev-r','ico-sm')}</span>
        </button>
      </div>
    </div>` : ''}

    ${total ? `<div class="stepwrap">${run.steps.map((st, i) => stepHTML(st, i)).join('')}</div>` : ''}

    ${run.result ? `<div class="card" style="margin-top:20px;background:${run.result.ok ? 'var(--ok-wash)' : 'var(--d-wash)'};box-shadow:none">
      <p class="od-row" style="--od-gap:8px;font-size:15px;font-weight:700;color:${run.result.ok ? 'var(--ok-fg)' : 'var(--d-fg)'}">${ic(run.result.ok ? 'check' : 'alert','ico-sm')}<span>${esc(run.result.t)}</span></p>
      <p style="margin-top:8px;font-size:14.5px;line-height:1.6">${esc(run.result.d)}</p>
      <p class="hint mono od-nowrap" style="margin-top:12px">本次消耗 ${esc(run.credit)} credit · Jev 预检 ${total} 次</p>
    </div>` : `<p class="hint mono od-nowrap" style="margin-top:20px">已消耗 ${esc(run.credit)} credit · Jev 预检 ${done} 次</p>`}
  `;

  const tf = $('#tfold');
  if (tf) tf.addEventListener('click', () => {
    const box = $('#tfoldbox'); box.hidden = !box.hidden;
    tf.setAttribute('aria-expanded', box.hidden ? 'false' : 'true');
  });

  $('#runFoot').innerHTML = run.status === 'noplan'
    ? `<button class="btn btn-primary btn-block" id="reword">换一种说法</button>`
    : run.status === 'waiting'
    ? `<button class="btn btn-primary btn-block" id="goAp">${ic('shield','ico-sm')}<span>去确认第 ${run.at + 1} 步</span></button>`
    : run.status === 'running'
      ? `<button class="btn btn-danger btn-block" id="stopRun">终止执行</button>`
      : `<div class="od-row" style="--od-gap:10px">
          <button class="btn btn-ghost od-fill" data-back="#/activity">返回活动</button>
          <button class="btn btn-primary od-fill" id="rerun">再次执行</button></div>`;

  driveStep(run); driveMeta(); driveCursor(run);
  $$('#runBody [data-recapture]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const st = run.steps[+b.dataset.recapture];
    st.cap = 'capturing'; renderRun(run.id);
    setTimeout(() => { st.cap = 'done'; renderRun(run.id); toast('画面已重新回传', 'refresh'); }, 900);
  }));

  const rw = $('#reword'); if (rw) rw.addEventListener('click', () => { go('#/mac'); openCompose(run.intent); });
  const ga = $('#goAp'); if (ga) ga.addEventListener('click', () => approveStep(run));
  const sr = $('#stopRun'); if (sr) sr.addEventListener('click', () => { clearTimeout(run.timer); run.status = 'stopped'; run.steps.forEach(x => { if (x.st === 'run') x.st = 'pending'; }); renderRun(run.id); toast('已终止','x'); });
  const rr = $('#rerun'); if (rr) rr.addEventListener('click', () => toast('再次执行会重新生成计划，本原型未展开','alert'));

  $$('#runBody .step-card').forEach(btn => btn.addEventListener('click', () => {
    const w = btn.closest('.step'), i = +w.dataset.i, st = run.steps[i];
    st.open = !st.open;
    btn.setAttribute('aria-expanded', st.open ? 'true' : 'false');
    const det = $('#stepdet-' + i, w); if (det) det.hidden = !st.open;
    if (st.open) w.scrollIntoView({ block:'nearest' });
  }));
}

/* StatusMark · CallChip · RefineFrame 组件 */
function smark(st) {
  const gly = st === 'fail' ? 'M8 8l6 6M14 8l-6 6'
    : st === 'wait' ? 'M11 6.6l4 1.6v3.1c0 2.2-1.6 3.9-4 4.6-2.4-.7-4-2.4-4-4.6V8.2l4-1.6Z'
    : 'M7.2 11.4l2.6 2.6L15 8.6';
  const p = st === 'run' ? 'var(--sp,.35)' : (st === 'done' || st === 'fail' || st === 'wait') ? 1 : 0;
  return `<svg class="smark" viewBox="0 0 22 22" style="--p:${p}" aria-hidden="true">
    <circle class="trk" cx="11" cy="11" r="9.2"/>
    <circle class="disc" cx="11" cy="11" r="10.5"/>
    ${st === 'run' ? '<circle class="arc" cx="11" cy="11" r="9.2"/>' : ''}
    <path class="gly" d="${gly}"/></svg>`;
}
function cchip(s) {
  if (s.st === 'pending' || s.st === 'skip') return `<span class="cchip idle"><span>待预检</span></span>`;
  if (s.st === 'run') return `<span class="cchip" style="--p:.55"><i></i><span class="js-ms" data-ms="${s.jev.ms}">0ms</span></span>`;
  const k = s.st === 'done' ? 'ok' : 'bad';
  return `<span class="cchip ${k}" style="--p:${s.st === 'done' ? 1 : .45}"><i></i>
    <span>${s.st === 'done' ? '' : '↻ '}${s.jev.ms}ms</span></span>`;
}
const CAP_STAGE = { queued:'排队中', capturing:'回传中', parsing:'解析中', done:'已回传', error:'回传失败' };

/* 画面本身不叠任何标签——状态放到画面下面那一行去说。
   画面上只允许出现「真的发生在那块屏幕上」的东西：Cua Driver 的指针，和回传失败时的重试。 */
let GCUR = { x:50, y:52 };
function rframe(stage, svg, opts) {
  opts = opts || {};
  return `<div class="rframe" data-stage="${stage}"${opts.id ? ` id="${opts.id}"` : ''}>
    <span class="pic">${svg}</span>
    ${stage === 'done' || stage === 'error' ? '' : '<span class="sweep" aria-hidden="true"></span>'}
    ${opts.cursor ? `<span class="gcur" aria-hidden="true" style="transform:translate(${GCUR.x}%,${GCUR.y}%)">${CURSOR}<i></i></span>` : ''}
    ${stage === 'error' ? `<button class="rf-retry" data-recapture="${opts.i}">${ic('refresh','ico-sm')}<span>重试回传</span></button>` : ''}
  </div>`;
}
/* 画面下方说明行里的状态 pill */
function rstate(text, kind) {
  return `<span class="rf-state od-fixed${kind ? ' ' + kind : ''}">${esc(text)}</span>`;
}

/* 这一步当前在操作哪块屏幕 */
function liveScene(s) {
  if (!s) return { svg:SHOT_MAC, hit:null, app:'桌面' };
  const sc = s.sc || (s.ch === 'GUI' ? 'figma' : 'mac');
  return {
    svg: sc === 'figma' ? SHOT_FIGMA : sc === 'mail' ? SHOT_MAIL : SHOT_MAC,
    hit: s.ch === 'GUI' ? (s.hit || null) : null,
    app: s.app || (sc === 'figma' ? 'Figma' : sc === 'mail' ? '邮件' : 'Terminal')
  };
}

function stepHTML(s, i) {
  const cls = { done:'done', run:'run', wait:'wait', fail:'fail', pending:'pending', skip:'pending' }[s.st] || 'pending';
  const idle = (s.st === 'pending' || s.st === 'skip');
  const jT = idle ? '待预检' : s.jev.d === '需确认' ? 'Jev 需确认' : 'Jev 放行';
  const jC = idle ? 'b-mute' : s.jev.d === '需确认' ? 'b-l1' : 'b-ok';
  const capStage = s.cap || (s.st === 'done' ? 'done' : s.st === 'run' ? 'capturing' : 'queued');
  const showCap = REC.shots && !idle;
  return `<div class="step ${cls}" data-i="${i}">
    <span class="stepdot" aria-hidden="true">${smark(s.st)}</span>
    <button class="step-card" id="stepbtn-${i}" aria-expanded="${s.open ? 'true' : 'false'}" aria-controls="stepdet-${i}">
      <span class="step-t">${esc(s.t)}</span>
      <span class="od-cluster" style="--od-gap:6px;margin-top:8px;font-size:11.5px;color:var(--fg-3)">
        <span class="chan${s.ch === 'GUI' ? ' g' : ''}">${esc(s.ch)}</span>
        <span class="badge ${LV[s.lv].c}" style="padding:2px 7px;font-size:10.5px"><span class="d" aria-hidden="true"></span>L${s.lv} ${LV[s.lv].t}</span>
        <span class="badge ${jC}" style="padding:2px 7px;font-size:10.5px">${esc(jT)}</span>
        ${cchip(s)}
      </span>
    </button>
    <div class="step-det" id="stepdet-${i}" role="region" aria-labelledby="stepbtn-${i}"${s.open ? '' : ' hidden'}>
      ${s.cmd ? `<pre class="code">${esc(s.cmd)}</pre>` : ''}
      ${s.out ? `<pre class="code out" style="margin-top:8px">${esc(s.out)}</pre>` : ''}
      ${showCap ? `<div style="margin-top:10px;border-radius:14px;overflow:hidden;box-shadow:var(--sh-1)">
        ${rframe(capStage, liveScene(s).svg, { i })}
        <p class="rf-cap od-row" style="--od-gap:8px">
          ${rstate(CAP_STAGE[capStage], capStage === 'error' ? 'bad' : '')}
          <span class="od-fill">${capStage === 'error' ? '这一步的画面没有回传成功'
            : capStage === 'done' ? '这一步结束时的屏幕状态'
            : capStage === 'parsing' ? '画面已收到，正在对齐这一步的操作'
            : '正在从 ' + esc(DEVICES[STATE.device].name) + ' 回传'}</span>
        </p>
      </div>` : (!idle && !REC.shots ? `<p class="hint" style="margin-top:10px">每步截图已关闭，这一步没有留下画面。可在「我的 → 录制与回放」中开启。</p>` : '')}
      ${idle ? '' : `<div class="jev" style="margin-top:10px">
        <div class="jev-r"><span class="jev-k">操作分级</span><span class="jev-v" style="color:${s.lv === 2 ? 'var(--d-fg)' : s.lv === 1 ? 'var(--w-fg)' : 'var(--fg-2)'}">Level ${s.lv} ${LV[s.lv].t}</span></div>
        <div class="jev-r"><span class="jev-k">匹配原始意图</span><span class="jev-v" style="color:${s.jev.m ? 'var(--ok-fg)' : 'var(--d-fg)'}">${s.jev.m}</span></div>
        <div class="jev-r"><span class="jev-k">不可逆风险</span><span class="riskbar${s.jev.r > STATE.thr ? ' hi' : ''}" aria-hidden="true"><i style="width:${Math.round(s.jev.r * 100)}%"></i></span><span class="jev-v">${s.jev.r.toFixed(2)}</span></div>
        <div class="jev-r"><span class="jev-k">置信度</span><span class="jev-v">${s.jev.c.toFixed(2)}</span></div>
      </div>`}
    </div>
    ${s.st === 'wait' && s.gate ? `<div class="notice" style="margin-top:10px;padding:13px 15px">
      ${ic('shield','ico-sm')}<span class="od-fill"><span class="n-t" style="font-size:14px">执行已暂停</span>
      <span class="n-d">${esc(s.gate.why)}</span></span></div>` : ''}
  </div>`;
}

/* 执行中步骤：进度弧与毫秒数跟真实进度走 */
let stepTick = null;
function driveStep(run) {
  clearInterval(stepTick);
  const i = run.steps.findIndex(x => x.st === 'run');
  if (i < 0) return;
  const target = run.steps[i].jev.ms, t0 = Date.now(), span = 1100;
  stepTick = setInterval(() => {
    const el = $$('#runBody .step')[i]; if (!el) { clearInterval(stepTick); return; }
    const p = Math.min(1, (Date.now() - t0) / span);
    const arc = $('.smark', el); if (arc) arc.style.setProperty('--sp', p.toFixed(3));
    const chip = $('.cchip', el); if (chip) chip.style.setProperty('--p', p.toFixed(3));
    const ms = $('.js-ms', el); if (ms) ms.textContent = Math.round(target * p) + 'ms';
    if (p >= 1) clearInterval(stepTick);
  }, 70);
}

/* 实时画面的动全部是有含义的：指针走到这一步真正要点的坐标，数字是当前回传的延迟 */
let metaTick = null, gcurTap = null;
function driveMeta() {
  clearInterval(metaTick);
  const m = $('#liveMeta');
  if (!m || m.dataset.jit !== '1') return;
  metaTick = setInterval(() => {
    const el = $('#liveMeta');
    if (!el || el.dataset.jit !== '1') { clearInterval(metaTick); return; }
    LIVE.ms = 74 + Math.round(Math.random() * 26);
    LIVE.fps = 11 + Math.round(Math.random() * 2);
    el.textContent = LIVE.fps + ' fps · 延迟 ' + LIVE.ms + 'ms';
  }, 620);
}
function driveCursor(run) {
  clearTimeout(gcurTap);
  const cur = $('#liveMini .gcur');
  if (!cur || !run) return;
  const hit = liveScene(run.steps[run.at]).hit;
  if (!hit || (GCUR.x === hit[0] && GCUR.y === hit[1])) return;
  GCUR = { x:hit[0], y:hit[1] };
  requestAnimationFrame(() => {
    const c = $('#liveMini .gcur');
    if (c) c.style.transform = `translate(${hit[0]}%,${hit[1]}%)`;
  });
  gcurTap = setTimeout(() => {
    const c = $('#liveMini .gcur');
    if (c) { c.classList.remove('tap'); void c.offsetWidth; c.classList.add('tap'); }
  }, 620);
}

function approveStep(run) {
  const s = run.steps[run.at];
  if (!s || !s.gate) return;
  openApproval({
    app:'系统', title:s.t, ch:s.ch, lv:s.lv, cmd:s.cmd, jev:s.jev, gate:s.gate,
    done:() => {
      s.st = 'done'; s.out = '已授权 · 密钥已注入执行环境（不落盘）'; s.gate = null;
      run.status = 'running'; run.credit = (parseFloat(run.credit) + 0.06).toFixed(2);
      run.at += 1; run.steps[run.at].st = 'run'; renderRun(run.id); tick(run);
    },
    rejected:() => {
      s.st = 'fail'; s.out = '已被你拒绝，未执行'; run.status = 'failed';
      run.steps.forEach((x, i) => { if (i > run.at) x.st = 'skip'; });
      run.result = { ok:false, t:'已拒绝', d:'你拒绝了这一步，后续步骤未执行，Mac 上没有任何改动。' };
      renderRun(run.id);
    },
    ok:'已确认，继续执行'
  });
}

function tick(run) {
  clearTimeout(run.timer);
  run.timer = setTimeout(() => {
    const s = run.steps[run.at], idx = run.at; if (!s) return;
    s.st = 'done'; s.cap = REC.shots ? 'parsing' : null;
    setTimeout(() => {
      if (s.cap !== 'parsing') return;
      s.cap = 'done';
      if (parseHash().name !== 'run') return;
      if (run.status !== 'running') { renderRun(run.id); return; }
      const el = $$('#runBody .step')[idx], fr = el && $('.rframe', el);
      if (!fr) { renderRun(run.id); return; }
      fr.dataset.stage = 'done';
      const sw = $('.sweep', fr); if (sw) sw.remove();
      const pill = $('.rf-state', el); if (pill) pill.textContent = CAP_STAGE.done;
      const txt = $('.rf-cap .od-fill', el); if (txt) txt.textContent = '这一步结束时的屏幕状态';
    }, 520);
    run.credit = (parseFloat(run.credit) + 0.04 + s.lv * 0.02).toFixed(2);
    if (run.at < run.steps.length - 1) {
      run.at += 1;
      const nx = run.steps[run.at];
      if (nx.gate) {
        nx.st = 'wait'; run.status = 'waiting';
        if (parseHash().name === 'run') renderRun(run.id);
        toast('第 ' + (run.at + 1) + ' 步需要你确认', 'shield');
        return;
      }
      nx.st = 'run';
      if (parseHash().name === 'run') renderRun(run.id);
      tick(run);
    } else {
      run.status = 'done';
      run.result = run.doneResult || { ok:true, t:'已完成', d:'计划里的每一步都执行完了。' };
      if (parseHash().name === 'run') renderRun(run.id);
      toast(run.result.t, 'check');
    }
  }, 1100);
}

/* ═════════ 意图输入 ═════════ */
function runningRun() { return ORDER.map(id => RUNS[id]).find(r => r && r.status === 'running') || null; }

function openCompose(prefill) {
  const m = MODELS.find(x => x.id === STATE.model);
  openSheet('让 Mac 做一件事', `

let seq = 2049;
function matchPlan(text) {
  if (/切图|导出|figma|dashboard/i.test(text)) return { steps:planExport(), label:'导出切图', result:EXPORT_RESULT };
  if (/发|传|邮件|附件|文件给/.test(text)) return { steps:planSend(), label:'发送文件' };
  if (/部署|上线|deploy|发布/.test(text)) return { steps:planDeploy(), label:'部署',
    result:{ ok:true, t:'部署完成', d:'release v1.42.0 已推送到 12 个边缘节点，健康检查返回 200。' } };
  return null;
}

function dispatch(text) {
  const id = 'r-' + (seq++);
  const hit = matchPlan(text);
  const run = { id, intent:text, steps:hit ? hit.steps : [], device:STATE.device,
    model:MODELS.find(m => m.id === STATE.model).n, started:'09:41', when:'刚刚',
    status:hit ? 'running' : 'noplan', at:-1, credit:'0.00', timer:null, result:null, planning:!!hit,
    pn:0, t0:0, doneResult:hit ? hit.result : null };
  run.steps.forEach(s => s.st = 'pending');
  RUNS[id] = run; ORDER.unshift(id); STATE.activeRun = id;
  go('#/run/' + id);

  if (!hit) {
    run.result = { ok:false, t:'还没有这条意图的执行计划',
      d:'调度层没有为这句话生成可执行的步骤。本原型只预置了「部署」和「发送文件」两条完整链路，其余意图不会套用别的计划去凑——那样跑出来的步骤和截图都不是你要的事。换一种说法，或从快捷指令里挑一条。' };
    renderRun(id);
    return;
  }

  // ThoughtLine：呼吸字形 + 实时时钟 + 步骤逐条流入 → 折叠成一行摘要
  const t0 = run.t0 = Date.now();
  renderRun(id);
  const clock = setInterval(() => {
    if (!run.planning) { clearInterval(clock); return; }
    const el = $('#tclock'); if (el) el.textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
  }, 100);
  const stream = setInterval(() => {
    if (run.pn >= run.steps.length) {
      clearInterval(stream); clearInterval(clock);
      run.planning = false; run.plannedIn = ((Date.now() - t0) / 1000).toFixed(1);
      run.at = 0; run.steps[0].st = 'run';
      if (parseHash().name === 'run') renderRun(id);
      tick(run);
      return;
    }
    run.pn += 1;
    const box = $('#tsteps');
    if (box) box.innerHTML = run.steps.slice(0, run.pn).map(x => `<span>${esc(x.t)}</span>`).join('');
  }, 150);
}

/* ═════════ 实时画面 ═════════ */
function renderLive(runId) {
  const run = runId ? RUNS[runId] : null;
  const shots = run ? run.steps.filter(x => x.cap === 'done') : [];
  // 任务已经结束就没有「实时」可言了，直接停在最后一帧
  const canLive = !run || run.status === 'running';
  if (LIVE.run !== (runId || '')) { LIVE.run = runId || ''; LIVE.at = canLive ? null : shots.length - 1; }
  if (!canLive && LIVE.at === null) LIVE.at = shots.length - 1;
  const at = LIVE.at === null ? -1 : Math.min(LIVE.at, shots.length - 1);
  const showingLive = at < 0;
  const cur = showingLive ? null : shots[at];
  $('#liveBack').dataset.back = run ? '#/run/' + run.id : '#/mac';

  $('#liveTitle').textContent = canLive ? '实时画面' : '画面回放';
  const dev = DEVICES[(run || { device:STATE.device }).device];
  if (dev.status === 'offline' || dev.status === 'unsupported') {
    $('#liveBody').innerHTML = `<div class="empty">
      <div class="empty-i">${ic('alert','ico-lg')}</div>
      <p class="empty-t">${esc(dev.name)} 已断开</p>
      <p class="empty-d">daemon 不在线，没有画面可以回传。设备重新上线后会自动恢复。</p>
      <button class="btn btn-ghost" style="margin-top:22px" id="liveRetry">${ic('refresh','ico-sm')}<span>重新连接</span></button></div>`;
    $('#liveRetry').addEventListener('click', () => toast('正在尝试重新连接…', 'refresh'));
    return;
  }

  if (REC.live === 'off' && showingLive) {
    $('#liveBody').innerHTML = `<div class="empty">
      <div class="empty-i">${ic('img','ico-lg')}</div>
      <p class="empty-t">实时画面已关闭</p>
      <p class="empty-d">当前设置下 daemon 不会持续回传屏幕。开启后可以边执行边看，但会额外占用流量与电量。</p>
      <button class="btn btn-primary" style="margin-top:22px" data-go="#/me">去设置里开启</button></div>`;
    return;
  }

  const liveSc = liveScene(run && canLive ? run.steps[run.at] : null);
  $('#liveTitle').textContent = canLive ? '实时画面' : '画面回放';

  $('#liveBody').innerHTML = `
    <div style="border-radius:16px;overflow:hidden;box-shadow:var(--sh-2)">
      ${rframe('done', showingLive ? liveSc.svg : liveScene(cur).svg,
        { cursor:showingLive && !!liveSc.hit, id:'liveFrame' })}
      <div class="rf-cap od-row" style="padding:11px 14px;--od-gap:9px">
        <span class="rf-state od-fixed${showingLive && LIVE.playing ? ' now' : ''}" id="liveState">${showingLive
          ? (LIVE.playing ? 'LIVE' : '已暂停') : '回放'}</span>
        <span class="od-fill" id="liveMeta"${showingLive && LIVE.playing ? ' data-jit="1"' : ''}>${showingLive
          ? (LIVE.playing ? `${LIVE.fps} fps · 延迟 ${LIVE.ms}ms` : '回传已暂停，画面停在最后一帧')
          : `第 ${run.steps.indexOf(cur) + 1} 步 · ${esc(cur.t)}`}</span>
        <span class="od-fixed mono od-nowrap">${esc(DEVICES[(run || {device:STATE.device}).device].name)}</span>
      </div>
    </div>

    ${canLive ? `<div class="od-row" style="--od-gap:10px;margin-top:16px">
      <button class="btn btn-ghost od-fill" id="livePlay">${ic(LIVE.playing ? 'pause' : 'play','ico-sm')}<span>${LIVE.playing ? '暂停回传' : '继续回传'}</span></button>
      <button class="btn ${showingLive ? 'btn-well' : 'btn-primary'} od-fill" id="liveNow">回到实时</button>
    </div>` : shots.length ? `<div class="od-row" style="--od-gap:10px;margin-top:16px">
      <button class="btn btn-ghost od-fill" id="livePrev">${ic('prev','ico-sm')}<span>上一帧</span></button>
      <button class="btn btn-ghost od-fill" id="liveNext"><span>下一帧</span>${ic('next','ico-sm')}</button>
    </div>` : ''}

    ${run && shots.length ? `<div style="margin-top:26px">
      <div class="sec"><h2>按步回放</h2><span class="hint od-nowrap">${shots.length} 帧</span></div>
      <label class="lbl sr-only" for="scrub">回放位置</label>
      <input class="scrub" type="range" id="scrub" min="0" max="${canLive ? shots.length : shots.length - 1}" step="1"
        value="${showingLive ? shots.length : at}" aria-valuetext="${showingLive ? '实时' : '第 ' + (at + 1) + ' 帧'}" />
      <div class="scrub-tick" id="liveTicks" aria-hidden="true">${shots.map((_, k) => `<i class="${!showingLive && k <= at ? 'on' : ''}"></i>`).join('')}</div>
      <p class="hint" style="margin-top:10px">${canLive
        ? '拖到最右端回到实时画面。只有已完成并成功回传的步骤才有帧。'
        : '这次任务已经结束，下面是每一步结束时保存下来的画面。'}</p>
    </div>` : run ? `<div class="empty" style="padding:38px 20px">
      <p class="empty-t" style="font-size:15px">还没有可回放的帧</p>
      <p class="empty-d">这次任务还没有步骤完成回传。</p></div>` : ''}

    <p class="hint" style="margin-top:24px">画面由被控设备上的 daemon 回传，端到端加密；本原型中的画面为设计占位，不是真实录屏。</p>`;

  // 拖滑杆时只换该换的那几个节点，不整屏重绘——否则手指还没松开画面就跳一次
  function paintFrame() {
    const a = LIVE.at === null ? -1 : Math.min(LIVE.at, shots.length - 1);
    const now = a < 0, c = now ? null : shots[a];
    const sc2 = now ? liveSc : liveScene(c);
    const pic = $('#liveFrame .pic'); if (pic) pic.innerHTML = sc2.svg;
    const st = $('#liveState');
    st.className = 'rf-state od-fixed' + (now && LIVE.playing ? ' now' : '');
    st.textContent = now ? (LIVE.playing ? 'LIVE' : '已暂停') : '回放';
    const meta = $('#liveMeta');
    if (now && LIVE.playing) meta.dataset.jit = '1'; else delete meta.dataset.jit;
    meta.textContent = now
      ? (LIVE.playing ? `${LIVE.fps} fps · 延迟 ${LIVE.ms}ms` : '回传已暂停，画面停在最后一帧')
      : `第 ${run.steps.indexOf(c) + 1} 步 · ${c.t}`;
    $$('#liveTicks i').forEach((n, k) => n.classList.toggle('on', !now && k <= a));
    const nb = $('#liveNow'); if (nb) nb.className = 'btn ' + (now ? 'btn-well' : 'btn-primary') + ' od-fill';
    const sl = $('#scrub');
    if (sl) { sl.value = now ? shots.length : a; sl.setAttribute('aria-valuetext', now ? '实时' : '第 ' + (a + 1) + ' 帧'); }
    driveMeta();
  }

  const pb = $('#livePlay');
  if (pb) pb.addEventListener('click', () => {
    LIVE.playing = !LIVE.playing; renderLive(runId);
    toast(LIVE.playing ? '已继续回传' : '已暂停回传', LIVE.playing ? 'play' : 'pause');
  });
  const nb = $('#liveNow');
  if (nb) nb.addEventListener('click', () => { LIVE.at = null; paintFrame(); });
  const step = d => {
    const a = LIVE.at === null ? shots.length - 1 : LIVE.at;
    LIVE.at = Math.max(0, Math.min(shots.length - 1, a + d));
    paintFrame();
  };
  const pv = $('#livePrev'); if (pv) pv.addEventListener('click', () => step(-1));
  const nx = $('#liveNext'); if (nx) nx.addEventListener('click', () => step(1));
  const sc = $('#scrub');
  if (sc) sc.addEventListener('input', e => {
    const v = +e.target.value;
    const next = (canLive && v >= shots.length) ? null : Math.min(v, shots.length - 1);
    if (next === LIVE.at) return;
    LIVE.at = next; paintFrame();
  });
  driveMeta();
}

/* ═════════ 配对 ═════════ */
function qrSVG() {
  const n = 21, cell = 8, pad = 10; let r = ''; let s = 7;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if ((x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)) continue;
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    if ((s >> 16) % 100 < 46) r += `<rect x="${pad + x * cell}" y="${pad + y * cell}" width="${cell}" height="${cell}" fill="#0E1114"/>`;
  }
  const f = (ox, oy) => {
    r += `<rect x="${pad + ox * cell}" y="${pad + oy * cell}" width="${7 * cell}" height="${7 * cell}" fill="#0E1114"/>`;
    r += `<rect x="${pad + (ox + 1) * cell}" y="${pad + (oy + 1) * cell}" width="${5 * cell}" height="${5 * cell}" fill="#fff"/>`;
    r += `<rect x="${pad + (ox + 2) * cell}" y="${pad + (oy + 2) * cell}" width="${3 * cell}" height="${3 * cell}" fill="#0E1114"/>`;
  };
  f(0, 0); f(n - 7, 0); f(0, n - 7);
  const size = n * cell + pad * 2;
  return `<svg class="od-media" viewBox="0 0 ${size} ${size}" role="img" aria-label="配对二维码占位图形，实际配对请使用下方 7 位配对码"><rect width="${size}" height="${size}" rx="12" fill="#fff"/>${r}</svg>`;
}

    };
    $('#scName').addEventListener('blur', () => check('scName','errName','给快捷指令起个名字，比如「部署」。'));
    $('#scCmd').addEventListener('blur', () => check('scCmd','errCmd','至少写一行命令，每行一条，按顺序执行。'));
    $('#scSave').addEventListener('click', () => {
      const a = check('scName','errName','给快捷指令起个名字，比如「部署」。');
      const b = check('scCmd','errCmd','至少写一行命令，每行一条，按顺序执行。');
      if (!a) { $('#scName').focus(); return; } if (!b) { $('#scCmd').focus(); return; }
      const btn = $('#scSave'); btn.disabled = true;
      btn.innerHTML = '<span class="spin" style="border-top-color:#fff;border-color:rgba(255,255,255,.3);border-top-color:#fff"></span><span>保存中…</span>';
      setTimeout(() => {
        const cmd = $('#scCmd').value.trim();
        SHORTCUTS.push({ name:$('#scName').value.trim(), trig:$('#scName').value.trim(), intent:$('#scName').value.trim(),
          cmd:cmd.split('\n').map(x => x.trim()).filter(Boolean).join(' && '), dev:DEVICES[STATE.device].name,
          lv:/sudo|security |defaults write|installer/.test(cmd) ? 2 : 1 });
        closeSheet(); renderShortcuts(); toast('快捷指令已保存','check');
      }, 820);
    });
  });
}

/* ═════════ 启动 ═════════ */
if (!location.hash) location.hash = STATE.seen ? '#/mac' : '#/welcome';
render();

})();
</script>

</body>
</html>
