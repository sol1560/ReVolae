<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<title>CuaRemote PoC</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --card: #ffffff; --fg: #111; --muted: #6e6e73; --line: #e5e5ea;
    --accent: #0a84ff; --ok: #34c759; --warn: #ff9f0a; --bad: #ff3b30;
    --l0: #34c759; --l1: #ff9f0a; --l2: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #2c2c2e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, "SF Pro Text", system-ui, "PingFang SC", sans-serif; }
  body { padding-bottom: calc(190px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 80%, transparent); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 20px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); display: inline-block; }
  #dot.on { background: var(--ok); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); max-width: 100%; }
  .muted { color: var(--muted); font-size: 13px; }
  main { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: 0 1px 0 var(--line); }
  .run-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .run-head b { font-size: 16px; }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .step { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
  .icon { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; }
  .step.running .icon { border-color: var(--accent); animation: pulse 1s infinite; }
  .step.done .icon { border-color: var(--ok); background: var(--ok); color: #fff; }
  .step.failed .icon { border-color: var(--bad); background: var(--bad); color: #fff; }
  .step.awaiting_approval .icon { border-color: var(--warn); background: var(--warn); color: #fff; }
  @keyframes pulse { 50% { opacity: .4; } }
  .title { font-weight: 500; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--muted); }
  .badge.L0 { background: color-mix(in srgb, var(--l0) 20%, transparent); color: var(--l0); }
  .badge.L1 { background: color-mix(in srgb, var(--l1) 20%, transparent); color: var(--l1); }
  .badge.L2 { background: color-mix(in srgb, var(--l2) 20%, transparent); color: var(--l2); }
  details { margin-top: 4px; }
  summary { font-size: 13px; color: var(--accent); cursor: pointer; }
  pre { margin: 6px 0 0; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all; background: var(--bg); padding: 8px; border-radius: 8px; max-height: 240px; overflow: auto; }
  .summary { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
  .summary.ok { color: var(--ok); } .summary.bad { color: var(--bad); }
  .cost { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); backdrop-filter: blur(20px); background: color-mix(in srgb, var(--bg) 85%, transparent); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .composer .row { flex-wrap: nowrap; }
  textarea { flex: 1; font: inherit; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--fg); resize: none; height: 44px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 10px 14px; background: var(--accent); color: #fff; }
  button:disabled { opacity: .4; }
  button.ghost { background: var(--line); color: var(--fg); }
  button.danger { background: var(--bad); }
  .seg { display: inline-flex; background: var(--line); border-radius: 10px; padding: 2px; }
  .seg button { background: transparent; color: var(--muted); padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  .seg button.on { background: var(--card); color: var(--fg); }
  .sheet { position: fixed; left: 12px; right: 12px; bottom: calc(150px + env(safe-area-inset-bottom)); z-index: 7; background: var(--card); border-radius: 20px; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.35); border: 1px solid var(--line); }
  .sheet[hidden] { display: none; }
  .sheet h2 { margin: 0 0 6px; font-size: 17px; display: flex; gap: 8px; align-items: center; }
  .sheet .detail { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; background: var(--bg); padding: 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-all; max-height: 30vh; overflow: auto; margin: 8px 0; }
  .sheet .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .sheet .actions button { padding: 12px 6px; font-size: 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .chips button { white-space: nowrap; background: var(--card); color: var(--fg); border: 1px solid var(--line); font-weight: 500; font-size: 13px; padding: 6px 12px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0 20px; }
  .toast { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; padding: 8px 14px; border-radius: 99px; font-size: 13px; z-index: 9; }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1><span id="dot"></span> CuaRemote <span class="muted" id="devname"></span></h1>
  <div class="row">
    <select id="provider" aria-label="模型"></select>
    <select id="autonomy" aria-label="自主程度">
      <option value="cautious">谨慎：写入都问我</option>
      <option value="balanced" selected>平衡：预检通过就做</option>
      <option value="handsoff">放手：只有系统级才问</option>
    </select>
  </div>
  <div class="muted" id="hint"></div>
</header>

<main id="runs"><div class="empty" id="empty">告诉这台电脑要做什么，比如「看看桌面上有什么」。</div></main>

<section class="sheet" id="sheet" hidden aria-live="assertive">
  <h2>需要你确认 <span class="badge" id="sheetLevel"></span></h2>
  <div id="sheetSummary"></div>
  <div class="detail" id="sheetDetail"></div>
  <div class="muted" id="sheetReason"></div>
  <div class="actions">
    <button class="danger" id="btnDeny">拒绝</button>
    <button class="ghost" id="btnAlways">以后自动</button>
    <button id="btnOnce">仅这次</button>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<div class="composer">
  <div class="chips" id="chips"></div>
  <div class="row">
    <div class="seg" id="mode"><button data-m="agent" class="on">让它做</button><button data-m="terminal">只给命令</button></div>
    <span class="muted" id="status"></span>
    <button class="danger" id="btnCancel" hidden>取消</button>
  </div>
  <div class="row">
    <textarea id="intent" placeholder="说你要干什么…" enterkeyhint="send"></textarea>
    <button id="btnSend">发送</button>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const runsEl = $('#runs'), sheet = $('#sheet'), toast = $('#toast');
  const state = { ws: null, runs: new Map(), current: null, pendingApproval: null, mode: 'agent', autonomy: 'balanced', provider: 'mock', ready: false };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

  // ---- 连接 ----
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    state.ws = ws;
    ws.onopen = () => { $('#dot').classList.add('on'); state.ready = true; setStatus(''); };
    ws.onclose = () => { $('#dot').classList.remove('on'); state.ready = false; setStatus('已断开，重连中…'); setTimeout(connect, 1500); };
    ws.onmessage = (ev) => { try { onMsg(JSON.parse(ev.data)); } catch (e) { showToast('收到坏消息 ' + e.message); } };
  }
  function send(body) {
    if (!state.ready) { showToast('还没连上'); return null; }
    const id = uuid();
    state.ws.send(JSON.stringify({ v: 1, id, ...body }));
    return id;
  }

  // ---- 收消息 ----
  function onMsg(m) {
    switch (m.type) {
      case 'capabilities': {
        $('#devname').textContent = '· ' + m.name;
        $('#hint').textContent = m.brainAvailable ? `${m.tools.length} 个工具 · 允许目录 ${m.scope.allowedDirs.join(', ')}` : '模型不可用：' + (m.brainUnavailableReason || '');
        break;
      }
      case 'run.created': {
        $('#empty')?.remove();
        const run = { id: m.runId, intent: m.intent, provider: m.provider, plan: m.plan, steps: new Map(), el: null };
        state.runs.set(m.runId, run); state.current = m.runId;
        run.el = document.createElement('section'); run.el.className = 'card';
        runsEl.prepend(run.el);
        renderRun(run);
        $('#btnCancel').hidden = false; setStatus('执行中…');
        break;
      }
      case 'plan.updated': { const r = state.runs.get(m.runId); if (r) { r.plan = m.plan; renderRun(r); } break; }
      case 'step.started': { const r = state.runs.get(m.runId); if (!r) break; step(r, m.stepId).title = m.title; step(r, m.stepId).channel = m.channel; step(r, m.stepId).status = 'running'; renderRun(r); break; }
      case 'step.precheck': { const r = state.runs.get(m.runId); if (!r) break; step(r, m.stepId).precheck = m; renderRun(r); break; }
      case 'step.approval_required': {
        const r = state.runs.get(m.runId); if (r) { step(r, m.stepId).status = 'awaiting_approval'; step(r, m.stepId).action = m.action; renderRun(r); }
        state.pendingApproval = m; showSheet(m);
        if (navigator.vibrate) navigator.vibrate(60);
        break;
      }
      case 'step.finished': {
        const r = state.runs.get(m.runId); if (!r) break;
        const s = step(r, m.stepId); s.status = m.ok ? 'done' : 'failed'; s.ms = m.ms; s.output = m.output; s.error = m.error; s.dataLeft = m.dataLeftDevice;
        if (state.pendingApproval && state.pendingApproval.stepId === m.stepId) hideSheet();
        renderRun(r); break;
      }
      case 'terminal.suggestion': {
        const r = state.runs.get(m.runId); if (!r) break;
        r.suggestion = m; renderRun(r); break;
      }
      case 'run.finished': {
        const r = state.runs.get(m.runId); if (r) { r.finished = m; renderRun(r); }
        if (state.current === m.runId) { state.current = null; $('#btnCancel').hidden = true; setStatus(''); hideSheet(); }
        break;
      }
      case 'error': showToast(m.message); if (m.code === 'busy' || m.code === 'provider_unavailable' || m.code === 'plan_failed') { setStatus(''); $('#btnSend').disabled = false; } break;
      case 'ack': break;
    }
  }
  function step(run, id) { if (!run.steps.has(id)) run.steps.set(id, { id, status: 'pending' }); return run.steps.get(id); }

  // ---- 渲染 ----
  function renderRun(run) {
    const items = run.plan.map((p) => ({ ...p, ...(run.steps.get(p.id) || {}) }));
    for (const [id, s] of run.steps) if (!run.plan.some((p) => p.id === id)) items.push(s);
    const lvlBadge = (pc) => pc ? `<span class="badge L${pc.level}">L${pc.level} ${pc.verdict === 'allow' ? '放行' : pc.verdict === 'confirm' ? '需确认' : '拒绝'}</span><span class="badge">${pc.source === 'jev' ? 'Jev ' + Math.round(pc.jevMs || 0) + 'ms' : pc.source === 'cache' ? '缓存' : pc.source === 'fallback' ? 'Jev 不可用→静态' : '静态规则'}</span>${pc.risk != null ? `<span class="badge">不可逆 ${pc.risk.toFixed(2)}</span>` : ''}` : '';
    const stepsHtml = items.map((s) => `
      <li class="step ${s.status}">
        <div class="icon">${s.status === 'done' ? '✓' : s.status === 'failed' ? '✕' : s.status === 'awaiting_approval' ? '!' : s.status === 'running' ? '…' : ''}</div>
        <div>
          <div class="title">${esc(s.title || '')} <span class="muted">${s.channel ? '· ' + s.channel : ''}${s.ms != null ? ' · ' + s.ms + 'ms' : ''}</span></div>
          <div class="badges">${lvlBadge(s.precheck)}${s.dataLeft ? '<span class="badge">数据出了设备</span>' : ''}</div>
          ${s.error ? `<div class="muted" style="color:var(--bad)">${esc(s.error)}</div>` : ''}
          ${s.output ? `<details><summary>输出</summary><pre>${esc(s.output)}</pre></details>` : ''}
        </div>
      </li>`).join('');
    const sug = run.suggestion ? `<div class="summary"><div class="muted">建议命令（不会自动执行）<span class="badge L${run.suggestion.level}">L${run.suggestion.level}</span></div><pre>${esc(run.suggestion.command)}</pre><div class="muted">${esc(run.suggestion.explanation)}</div></div>` : '';
    const fin = run.finished ? `<div class="summary ${run.finished.ok ? 'ok' : 'bad'}">${run.finished.cancelled ? '已取消' : run.finished.ok ? '完成' : '失败'}：${esc(run.finished.summary)}</div><div class="cost">$${run.finished.cost.usd.toFixed(4)} · 输入 ${run.finished.cost.inputTokens} / 输出 ${run.finished.cost.outputTokens} / Jev ${run.finished.cost.jevTokens} tokens · ${run.finished.stepCount} 步</div>` : '';
    run.el.innerHTML = `<div class="run-head"><b>${esc(run.intent)}</b><span class="muted">${esc(run.provider)}</span></div><ol class="steps">${stepsHtml}</ol>${sug}${fin}`;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // ---- 审批 ----
  function showSheet(m) {
    $('#sheetLevel').textContent = 'L' + m.level; $('#sheetLevel').className = 'badge L' + m.level;
    $('#sheetSummary').textContent = m.action.summary + (m.action.targetApp ? ' · ' + m.action.targetApp : '');
    $('#sheetDetail').textContent = m.action.detail;
    $('#sheetReason').textContent = m.reason;
    $('#btnAlways').hidden = m.level >= 2;
    sheet.hidden = false;
  }
  function hideSheet() { sheet.hidden = true; state.pendingApproval = null; }
  function decide(allow, remember) {
    const m = state.pendingApproval; if (!m) return;
    send({ type: 'approval.decision', runId: m.runId, stepId: m.stepId, allow, remember });
    hideSheet();
  }
  $('#btnOnce').onclick = () => decide(true, 'once');
  $('#btnAlways').onclick = () => decide(true, 'always');
  $('#btnDeny').onclick = () => decide(false, 'once');

  // ---- 发送 ----
  function submit() {
    const text = $('#intent').value.trim(); if (!text) return;
    if (state.current) { showToast('上一条还在跑'); return; }
    const id = send({ type: 'intent.submit', text, deviceId: 'local', mode: state.mode, provider: state.provider });
    if (id) { $('#intent').value = ''; setStatus('思考中…'); }
  }
  $('#btnSend').onclick = submit;
  $('#intent').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  $('#btnCancel').onclick = () => { if (state.current) send({ type: 'run.cancel', runId: state.current }); };
  $('#mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; state.mode = b.dataset.m; for (const x of $('#mode').children) x.classList.toggle('on', x === b); $('#intent').placeholder = state.mode === 'terminal' ? '想在终端里做什么？只会给你命令' : '说你要干什么…'; });
  $('#provider').onchange = (e) => { state.provider = e.target.value; };
  $('#autonomy').onchange = (e) => { state.autonomy = e.target.value; showToast('PoC 里自主程度由服务端启动参数决定（--autonomy）'); };
  function setStatus(t) { $('#status').textContent = t; }
  let toastTimer; function showToast(t) { toast.textContent = t; toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.hidden = true, 3500); }

  // ---- 快捷例子 ----
  const examples = ['看看桌面上有什么', '当前目录 git 状态', 'shell: uname -a', 'shell: date && then: uptime', '把 ~/Downloads 里最近 3 个文件列出来'];
  $('#chips').innerHTML = examples.map((t) => `<button>${esc(t)}</button>`).join('');
  $('#chips').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { $('#intent').value = b.textContent; $('#intent').focus(); } });

  // ---- 模型列表 ----
  fetch('/api/providers').then((r) => r.json()).then((d) => {
    state.provider = d.default; state.autonomy = d.autonomy; $('#autonomy').value = d.autonomy;
    $('#provider').innerHTML = d.options.map((o) => `<option value="${esc(o.id)}" ${o.id === d.default ? 'selected' : ''} ${o.available ? '' : 'disabled'}>${esc(o.label)}${o.tier === 'local' ? ' · 不出设备' : o.tier === 'zdr' ? ' · ZDR' : ''}${o.available ? '' : '（没配 key）'}</option>`).join('');
  }).catch(() => {});
  connect();
})();
</script>
</body>
</html>
