[project]
name = "jev-eval"
version = "0.1.0"
description = "CuaRemote Jev 预检评测包"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "rich>=13.7,<15",
]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
