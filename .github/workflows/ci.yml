name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test packages/protocol/test/fresh-link.test.ts
      - run: swift test --package-path packages/protocol/swift
      - run: swift test --package-path packages/apple
      - run: swift test --package-path packages/macos

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest pytest -q
      - run: uv sync && uv run pytest -q
        working-directory: packages/jev-eval
